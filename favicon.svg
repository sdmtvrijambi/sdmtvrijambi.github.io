<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="orbQuas" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#46dcff"/>
      <stop offset="65%" stop-color="#0084cc"/>
      <stop offset="100%" stop-color="#023059"/>
    </radialGradient>
    <radialGradient id="orbWex" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#df80ff"/>
      <stop offset="65%" stop-color="#9933cc"/>
      <stop offset="100%" stop-color="#3d0d5a"/>
    </radialGradient>
    <radialGradient id="orbExort" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffb833"/>
      <stop offset="65%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#661100"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241433"/>
      <stop offset="75%" stop-color="#12061c"/>
      <stop offset="100%" stop-color="#06020a"/>
    </radialGradient>
    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arcane Plate Background -->
  <circle cx="32" cy="32" r="30" fill="url(#darkBg)" stroke="url(#goldRim)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldRim)" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.75"/>

  <!-- Magic Triad Runes connecting the 3 elements -->
  <polygon points="32,15 47,44 17,44" fill="none" stroke="url(#goldRim)" stroke-width="1.2" opacity="0.6"/>
  <polygon points="32,49 17,20 47,20" fill="none" stroke="url(#goldRim)" stroke-width="1.2" opacity="0.6"/>

  <!-- Central Arcane Core -->
  <circle cx="32" cy="32" r="4.5" fill="url(#goldRim)"/>
  <path d="M32 23 L34 30 L41 32 L34 34 L32 41 L30 34 L23 32 L30 30 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Quas Orb (Top - Ice/Blue) -->
  <circle cx="32" cy="14" r="8.5" fill="url(#orbQuas)" stroke="#80e5ff" stroke-width="1.2" filter="url(#orbGlow)"/>
  <ellipse cx="30" cy="12" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>

  <!-- Wex Orb (Bottom Right - Storm/Purple) -->
  <circle cx="47" cy="42" r="8.5" fill="url(#orbWex)" stroke="#e699ff" stroke-width="1.2" filter="url(#orbGlow)"/>
  <ellipse cx="45" cy="40" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>

  <!-- Exort Orb (Bottom Left - Fire/Orange) -->
  <circle cx="17" cy="42" r="8.5" fill="url(#orbExort)" stroke="#ffaa80" stroke-width="1.2" filter="url(#orbGlow)"/>
  <ellipse cx="15" cy="40" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
</svg>
