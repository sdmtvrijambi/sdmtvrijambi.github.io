<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NexusFlow: Sovereign Form Architect — A cyber-organic data-inflow engine for building premium interactive forms with stunning visual effects." />
  <meta name="theme-color" content="#080B10" />
  <title>NexusFlow — Sovereign Form Architect</title>

  <!-- Typography: Rajdhani (robotic/status) + Inter (body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="nexusflow-app">

    <!-- ═══════════════════════════════════════════════════════════════
         CANVAS LAYERS (behind everything)
         PCB Circuit traces + overlay effects
    ═══════════════════════════════════════════════════════════════ -->
    <canvas id="pcb-canvas" aria-hidden="true"></canvas>
    <canvas id="effects-canvas" aria-hidden="true"></canvas>

    <!-- ═══════════════════════════════════════════════════════════════
         TOP BAR — Logo, Form Title, Progress Tube, Actions
    ═══════════════════════════════════════════════════════════════ -->
    <header id="top-bar">
      <div id="logo">
        <span class="logo__pulse"></span>
        <span class="logo__text">NEXUS<span class="logo__accent">FLOW</span></span>
      </div>

      <div class="top-bar__divider"></div>

      <input
        type="text"
        id="form-title"
        class="form-title-input"
        value="Untitled Form"
        placeholder="Enter form title..."
        spellcheck="false"
        aria-label="Form title"
      />

      <div id="progress-tube-container"></div>

      <div class="top-bar__divider"></div>

      <div id="top-actions" class="top-actions">
        <button id="sound-toggle" class="cyber-btn cyber-btn--icon" title="Toggle Sound" aria-label="Toggle sound effects">
          🔊
        </button>
        <button id="preview-btn" class="cyber-btn" title="Preview Form">
          <span class="btn-icon">👁</span>
          <span class="btn-label">PREVIEW</span>
        </button>
        <button id="publish-btn" class="cyber-btn cyber-btn--primary" title="Publish Form">
          <span class="btn-icon">⚡</span>
          <span class="btn-label">PUBLISH</span>
        </button>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         MAIN WORKSPACE — Three floating panels
    ═══════════════════════════════════════════════════════════════ -->
    <main id="workspace">

      <!-- ─── Panel Left: Component Fabricator ─── -->
      <aside id="fabricator-panel" class="glass-panel">
        <!-- Populated by ui.js -->
      </aside>

      <!-- ─── Panel Center: The Hydration Canvas ─── -->
      <section id="hydration-canvas">
        <div id="questions-container">
          <!-- Question blocks appended here by app.js -->
        </div>
      </section>

      <!-- ─── Panel Right: Energy & Logic Controller ─── -->
      <aside id="logic-panel" class="glass-panel">
        <!-- Populated by ui.js -->
      </aside>

    </main>

    <!-- ═══════════════════════════════════════════════════════════════
         DATA SINK — Fusion reactor visualization (bottom, hidden)
    ═══════════════════════════════════════════════════════════════ -->
    <div id="data-sink-container" class="hidden" aria-hidden="true"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         RESPONDENT OVERLAY — Full-screen form filling experience
    ═══════════════════════════════════════════════════════════════ -->
    <div id="respondent-overlay" class="hidden" aria-hidden="true"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         BOOT SCREEN — Shown briefly on load
    ═══════════════════════════════════════════════════════════════ -->
    <div id="boot-screen">
      <div class="boot-screen__content">
        <div class="boot-screen__logo">
          <span class="boot-screen__nx">NX</span>
          <div class="boot-screen__circuit-line"></div>
        </div>
        <div class="boot-screen__text">
          <span class="boot-screen__label">INITIALIZING</span>
          <span class="boot-screen__dots">
            <span>.</span><span>.</span><span>.</span>
          </span>
        </div>
        <div class="boot-screen__bar">
          <div class="boot-screen__bar-fill"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
