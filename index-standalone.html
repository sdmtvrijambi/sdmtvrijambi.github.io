  <script>
/**
 * NexusFlow Canvas Rendering Engine
 * ==================================
 * Handles all canvas-based visual effects for the NexusFlow form builder:
 *   - PCB circuit background with animated electric pulses
 *   - Particle systems for shockwave, error, and submission effects
 *   - Optimized render loop with delta-time and visibility handling
 *
 * @module canvas
 */

// ─── Color Constants ────────────────────────────────────────────────────────────
const COLORS = {
  CYAN:       '#00F0FF',
  CYAN_RGB:   [0, 240, 255],
  PURPLE:     '#8A2BE2',
  PURPLE_RGB: [138, 43, 226],
  FLUID:      '#00A3FF',
  FLUID_RGB:  [0, 163, 255],
  BASE:       '#080B10',
  ERROR:      '#FF2D55',
  ERROR_RGB:  [255, 45, 85],
};

// ─── Easing & Utility Functions ─────────────────────────────────────────────────

/** @param {number} t - Progress 0-1 @returns {number} */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

/** @param {number} t - Progress 0-1 @returns {number} */
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

/** @param {number} t - Progress 0-1 @returns {number} */
function easeInCubic(t) { return t * t * t; }

/** @param {number} a @param {number} b @param {number} t @returns {number} */
function lerp(a, b, t) { return a + (b - a) * t; }

/** @param {number} min @param {number} max @returns {number} */
function randomRange(min, max) { return Math.random() * (max - min) + min; }

/** @param {number} min @param {number} max @returns {number} inclusive */
function randomInt(min, max) { return Math.floor(randomRange(min, max + 1)); }

/**
 * Clamp a value between min and max.
 * @param {number} v @param {number} lo @param {number} hi @returns {number}
 */
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// ─── Particle ───────────────────────────────────────────────────────────────────

/**
 * Individual particle used across all effect types.
 */
class Particle {
  /**
   * @param {number} x
   * @param {number} y
   * @param {number} vx - velocity x (px/s)
   * @param {number} vy - velocity y (px/s)
   * @param {number} radius
   * @param {number[]} rgb - [r, g, b]
   * @param {number} life - total lifetime in seconds
   * @param {number} [glow=0] - shadow blur radius for glow effect
   */
  constructor(x, y, vx, vy, radius, rgb, life, glow = 0) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.radius = radius;
    this.rgb = rgb;
    this.life = life;
    this.maxLife = life;
    this.glow = glow;
    this.alive = true;
  }

  /** @param {number} dt - delta time in seconds */
  update(dt) {
    if (!this.alive) return;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) {
      this.alive = false;
    }
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    if (!this.alive) return;
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    const [r, g, b] = this.rgb;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * (0.3 + 0.7 * alpha), 0, Math.PI * 2);
    if (this.glow > 0) {
      ctx.shadowColor = `rgba(${r},${g},${b},${alpha})`;
      ctx.shadowBlur = this.glow * alpha;
    }
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
    if (this.glow > 0) {
      ctx.shadowBlur = 0;
    }
  }

  /** @returns {boolean} */
  get isDead() { return !this.alive; }
}

// ─── Particle System ────────────────────────────────────────────────────────────

const MAX_PARTICLES = 500;

/**
 * Manages pools of particles for all effect types.
 */
class ParticleSystem {
  constructor() {
    /** @type {Particle[]} */
    this.particles = [];
  }

  /**
   * Emit particles from configuration.
   * @param {Object} config
   * @param {number} config.x
   * @param {number} config.y
   * @param {number} config.count
   * @param {number[]} config.rgb
   * @param {number} [config.radiusMin=1]
   * @param {number} [config.radiusMax=3]
   * @param {number} [config.speedMin=30]
   * @param {number} [config.speedMax=150]
   * @param {number} [config.lifeMin=0.3]
   * @param {number} [config.lifeMax=0.8]
   * @param {number} [config.glow=0]
   * @param {number} [config.angleMin=0]
   * @param {number} [config.angleMax=Math.PI*2]
   * @param {Function} [config.customInit] - (particle, index) => void for custom setup
   */
  emit(config) {
    const count = Math.min(config.count, MAX_PARTICLES - this.particles.length);
    for (let i = 0; i < count; i++) {
      const angle = randomRange(config.angleMin ?? 0, config.angleMax ?? Math.PI * 2);
      const speed = randomRange(config.speedMin ?? 30, config.speedMax ?? 150);
      const p = new Particle(
        config.x,
        config.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        randomRange(config.radiusMin ?? 1, config.radiusMax ?? 3),
        config.rgb,
        randomRange(config.lifeMin ?? 0.3, config.lifeMax ?? 0.8),
        config.glow ?? 0
      );
      if (config.customInit) config.customInit(p, i);
      this.particles.push(p);
    }
  }

  /**
   * Directly add a particle.
   * @param {Particle} p
   */
  add(p) {
    if (this.particles.length < MAX_PARTICLES) {
      this.particles.push(p);
    }
  }

  /** @param {number} dt */
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (this.particles[i].isDead) {
        // Swap-remove for perf
        this.particles[i] = this.particles[this.particles.length - 1];
        this.particles.pop();
      }
    }
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    for (const p of this.particles) {
      p.draw(ctx);
    }
  }

  get count() { return this.particles.length; }
}

// ─── Shockwave Ring ─────────────────────────────────────────────────────────────

/**
 * Expanding radial ring effect triggered on component drop.
 */
class Shockwave {
  /**
   * @param {number} x
   * @param {number} y
   * @param {number} maxRadius
   * @param {number} duration - seconds
   * @param {number[]} rgb
   */
  constructor(x, y, maxRadius = 200, duration = 0.6, rgb = COLORS.CYAN_RGB) {
    this.x = x;
    this.y = y;
    this.maxRadius = maxRadius;
    this.duration = duration;
    this.rgb = rgb;
    this.elapsed = 0;
    this.alive = true;
  }

  /** @param {number} dt */
  update(dt) {
    if (!this.alive) return;
    this.elapsed += dt;
    if (this.elapsed >= this.duration) this.alive = false;
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    if (!this.alive) return;
    const t = clamp(this.elapsed / this.duration, 0, 1);
    const eased = easeOutCubic(t);
    const radius = eased * this.maxRadius;
    const alpha = 1 - eased;
    const [r, g, b] = this.rgb;

    ctx.beginPath();
    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.8})`;
    ctx.lineWidth = lerp(3, 0.5, eased);
    ctx.shadowColor = `rgba(${r},${g},${b},${alpha})`;
    ctx.shadowBlur = 20 * alpha;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Inner softer ring
    if (radius > 10) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, radius * 0.7, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.3})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  get isDead() { return !this.alive; }
}

// ─── Lightning Effect ───────────────────────────────────────────────────────────

/**
 * Jagged lightning bolt for error flash effects.
 */
class LightningBolt {
  /**
   * @param {number} x - origin x
   * @param {number} y - origin y
   * @param {number[]} rgb
   */
  constructor(x, y, rgb = COLORS.ERROR_RGB) {
    this.x = x;
    this.y = y;
    this.rgb = rgb;
    this.elapsed = 0;
    this.alive = true;
    this.totalDuration = 0.5; // total seconds: flash on 100ms, off 50ms, on 80ms, fade 270ms
    this.segments = this._generateBolts();
  }

  /**
   * Generate 3-4 branching lightning paths.
   * @returns {Array<Array<{x:number, y:number}>>}
   */
  _generateBolts() {
    const bolts = [];
    const count = randomInt(3, 4);
    for (let b = 0; b < count; b++) {
      const angle = randomRange(0, Math.PI * 2);
      const length = randomRange(40, 100);
      const steps = randomInt(4, 7);
      const points = [{ x: this.x, y: this.y }];
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const px = this.x + Math.cos(angle) * length * t + randomRange(-15, 15);
        const py = this.y + Math.sin(angle) * length * t + randomRange(-15, 15);
        points.push({ x: px, y: py });
      }
      bolts.push(points);
    }
    return bolts;
  }

  /** @param {number} dt */
  update(dt) {
    if (!this.alive) return;
    this.elapsed += dt;
    if (this.elapsed >= this.totalDuration) this.alive = false;
  }

  /**
   * Determine visibility based on flash pattern.
   * @returns {number} alpha 0-1
   */
  _getAlpha() {
    const e = this.elapsed * 1000; // ms
    if (e < 100) return 1.0;              // on
    if (e < 150) return 0.0;              // off
    if (e < 230) return 0.9;              // on
    // fade out
    const fadeT = (e - 230) / 270;
    return clamp(1 - fadeT, 0, 1);
  }

  /** @param {CanvasRenderingContext2D} ctx */
  draw(ctx) {
    if (!this.alive) return;
    const alpha = this._getAlpha();
    if (alpha <= 0) return;
    const [r, g, b] = this.rgb;

    ctx.save();
    ctx.shadowColor = `rgba(${r},${g},${b},${alpha})`;
    ctx.shadowBlur = 15 * alpha;
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const bolt of this.segments) {
      ctx.beginPath();
      ctx.moveTo(bolt[0].x, bolt[0].y);
      for (let i = 1; i < bolt.length; i++) {
        ctx.lineTo(bolt[i].x, bolt[i].y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  get isDead() { return !this.alive; }
}

// ─── Submission Cascade ─────────────────────────────────────────────────────────

/**
 * Manages the staged particle cascade from form blocks to the data sink.
 */
class SubmissionCascade {
  /**
   * @param {Array<{x:number,y:number,width:number,height:number}>} sourceRects
   * @param {{x:number,y:number,width:number,height:number}} sinkRect
   * @param {ParticleSystem} particleSystem
   */
  constructor(sourceRects, sinkRect, particleSystem) {
    this.sourceRects = sourceRects;
    this.sinkRect = sinkRect;
    this.ps = particleSystem;
    this.elapsed = 0;
    this.alive = true;
    this.emitted = new Set();
    this.staggerDelay = 0.1; // 100ms between each source
    this.totalDuration = 2.0;
    this.sinkCenterX = sinkRect.x + sinkRect.width / 2;
    this.sinkCenterY = sinkRect.y + sinkRect.height / 2;
    /** @type {Array<{x:number,y:number,timer:number}>} */
    this.sinkFlashes = [];
  }

  /** @param {number} dt */
  update(dt) {
    if (!this.alive) return;
    this.elapsed += dt;

    // Emit particles for each source in staggered fashion
    for (let i = 0; i < this.sourceRects.length; i++) {
      const triggerTime = i * this.staggerDelay;
      if (this.elapsed >= triggerTime && !this.emitted.has(i)) {
        this.emitted.add(i);
        this._emitFromSource(this.sourceRects[i]);
      }
    }

    // Update sink flashes
    for (let i = this.sinkFlashes.length - 1; i >= 0; i--) {
      this.sinkFlashes[i].timer -= dt;
      if (this.sinkFlashes[i].timer <= 0) {
        this.sinkFlashes.splice(i, 1);
      }
    }

    if (this.elapsed >= this.totalDuration) this.alive = false;
  }

  /**
   * Emit particles from a source rect flowing toward sink.
   * @param {{x:number,y:number,width:number,height:number}} rect
   */
  _emitFromSource(rect) {
    const cx = rect.x + rect.width / 2;
    const cy = rect.y + rect.height / 2;
    const count = randomInt(20, 30);
    const sinkX = this.sinkCenterX;
    const sinkY = this.sinkCenterY;
    const cascadeRef = this;

    this.ps.emit({
      x: cx,
      y: cy,
      count,
      rgb: Math.random() > 0.5 ? COLORS.CYAN_RGB : COLORS.FLUID_RGB,
      radiusMin: 2,
      radiusMax: 5,
      speedMin: 60,
      speedMax: 120,
      lifeMin: 1.0,
      lifeMax: 1.8,
      glow: 12,
      angleMin: 0,
      angleMax: Math.PI * 2,
      customInit(p, idx) {
        // Override velocity to flow toward sink with wave motion
        const dx = sinkX - cx;
        const dy = sinkY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = randomRange(150, 300);
        const travelTime = dist / speed;

        // Store target and wave parameters on particle
        p._targetX = sinkX + randomRange(-20, 20);
        p._targetY = sinkY + randomRange(-10, 10);
        p._originX = cx + randomRange(-rect.width / 2, rect.width / 2);
        p._originY = cy + randomRange(-rect.height / 4, rect.height / 4);
        p._travelTime = travelTime;
        p._waveAmp = randomRange(15, 40);
        p._waveFreq = randomRange(3, 6);
        p._elapsed = 0;
        p._cascadeRef = cascadeRef;
        p.x = p._originX;
        p.y = p._originY;

        // Override update to use guided flow
        const origUpdate = p.update.bind(p);
        p.update = function(dt) {
          if (!this.alive) return;
          this._elapsed += dt;
          this.life -= dt;
          if (this.life <= 0) { this.alive = false; return; }

          const t = clamp(this._elapsed / this._travelTime, 0, 1);
          const eased = easeOutQuad(t);

          // Lerp position from origin to target
          this.x = lerp(this._originX, this._targetX, eased);
          this.y = lerp(this._originY, this._targetY, eased);

          // Add wave motion perpendicular to path
          const perpX = -(this._targetY - this._originY);
          const perpY = (this._targetX - this._originX);
          const perpLen = Math.sqrt(perpX * perpX + perpY * perpY) || 1;
          const wave = Math.sin(this._elapsed * this._waveFreq * Math.PI * 2) * this._waveAmp * (1 - eased);
          this.x += (perpX / perpLen) * wave;
          this.y += (perpY / perpLen) * wave;

          // Flash when reaching sink
          if (t >= 0.95 && this.alive) {
            this.alive = false;
            if (this._cascadeRef && this._cascadeRef.alive) {
              this._cascadeRef.sinkFlashes.push({
                x: this.x,
                y: this.y,
                timer: 0.15
              });
            }
          }
        };
      }
    });
  }

  /** @param {CanvasRenderingContext2D} ctx */
  drawFlashes(ctx) {
    for (const flash of this.sinkFlashes) {
      const alpha = clamp(flash.timer / 0.15, 0, 1);
      const r = 8 * alpha;
      ctx.beginPath();
      ctx.arc(flash.x, flash.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.8})`;
      ctx.shadowColor = `rgba(0, 240, 255, ${alpha})`;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  get isDead() { return !this.alive; }
}

// ─── PCB Circuit Layout ─────────────────────────────────────────────────────────

/**
 * Generate and manage the static PCB circuit background.
 */
class PCBCircuit {
  /**
   * @param {number} width
   * @param {number} height
   */
  constructor(width, height) {
    this.width = width;
    this.height = height;
    this.gridSpacing = 80;
    /** @type {Array<{x:number, y:number, isJunction:boolean}>} */
    this.nodes = [];
    /** @type {Array<{from:number, to:number, path:Array<{x:number,y:number}>}>} */
    this.traces = [];
    /** @type {Array<{x:number, y:number, w:number, h:number}>} */
    this.pads = [];
    /** @type {Array<{traceIdx:number, progress:number, speed:number, alive:boolean}>} */
    this.pulses = [];
    /** @type {Array<{nodeIdx:number, alpha:number, decay:number}>} */
    this.nodeFlashes = [];
    this.pulseTimer = 0;
    this.flashTimer = 0;

    /** @type {OffscreenCanvas|HTMLCanvasElement|null} */
    this.staticLayer = null;

    this._generate();
  }

  /** Generate the grid nodes, traces, and pads. */
  _generate() {
    const cols = Math.ceil(this.width / this.gridSpacing) + 1;
    const rows = Math.ceil(this.height / this.gridSpacing) + 1;

    // Create nodes with slight random offset
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = c * this.gridSpacing + randomRange(-10, 10);
        const y = r * this.gridSpacing + randomRange(-10, 10);
        const isJunction = Math.random() < 0.15;
        this.nodes.push({ x, y, isJunction });
      }
    }

    // Connect nodes with orthogonal traces (horizontal-then-vertical)
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        // Connect right
        if (c < cols - 1 && Math.random() < 0.35) {
          const rightIdx = idx + 1;
          this._addTrace(idx, rightIdx);
        }
        // Connect down
        if (r < rows - 1 && Math.random() < 0.3) {
          const downIdx = idx + cols;
          this._addTrace(idx, downIdx);
        }
        // Occasional L-shaped traces (right then down)
        if (c < cols - 1 && r < rows - 1 && Math.random() < 0.12) {
          const cornerIdx = idx + 1;
          const endIdx = idx + 1 + cols;
          if (cornerIdx < this.nodes.length && endIdx < this.nodes.length) {
            const from = this.nodes[idx];
            const corner = this.nodes[cornerIdx];
            const to = this.nodes[endIdx];
            this.traces.push({
              from: idx,
              to: endIdx,
              path: [
                { x: from.x, y: from.y },
                { x: corner.x, y: from.y },  // horizontal first
                { x: corner.x, y: to.y }     // then vertical
              ]
            });
          }
        }
      }
    }

    // Add component pads at random positions along some traces
    for (const trace of this.traces) {
      if (Math.random() < 0.08) {
        const mid = Math.floor(trace.path.length / 2);
        const pt = trace.path[mid] || trace.path[0];
        this.pads.push({
          x: pt.x - 4,
          y: pt.y - 2.5,
          w: 8,
          h: 5
        });
      }
    }
  }

  /**
   * Add a straight orthogonal trace between two nodes.
   * @param {number} fromIdx
   * @param {number} toIdx
   */
  _addTrace(fromIdx, toIdx) {
    const from = this.nodes[fromIdx];
    const to = this.nodes[toIdx];
    // Orthogonal: horizontal then vertical
    if (Math.abs(from.x - to.x) > 2 && Math.abs(from.y - to.y) > 2) {
      this.traces.push({
        from: fromIdx,
        to: toIdx,
        path: [
          { x: from.x, y: from.y },
          { x: to.x, y: from.y },
          { x: to.x, y: to.y }
        ]
      });
    } else {
      this.traces.push({
        from: fromIdx,
        to: toIdx,
        path: [
          { x: from.x, y: from.y },
          { x: to.x, y: to.y }
        ]
      });
    }
  }

  /**
   * Render the static circuit to an offscreen buffer.
   * @returns {OffscreenCanvas|HTMLCanvasElement}
   */
  renderStaticLayer() {
    let canvas;
    if (typeof OffscreenCanvas !== 'undefined') {
      canvas = new OffscreenCanvas(this.width, this.height);
    } else {
      canvas = document.createElement('canvas');
      canvas.width = this.width;
      canvas.height = this.height;
    }
    const ctx = canvas.getContext('2d');

    // Traces
    ctx.strokeStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, 0.15)`;
    ctx.lineWidth = 0.7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const trace of this.traces) {
      ctx.beginPath();
      ctx.moveTo(trace.path[0].x, trace.path[0].y);
      for (let i = 1; i < trace.path.length; i++) {
        ctx.lineTo(trace.path[i].x, trace.path[i].y);
      }
      ctx.stroke();
    }

    // Junction nodes (larger circles)
    for (const node of this.nodes) {
      if (node.isJunction) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, randomRange(2.5, 4), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, 0.12)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, 0.2)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    // Component pads
    ctx.fillStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, 0.1)`;
    ctx.strokeStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, 0.18)`;
    ctx.lineWidth = 0.5;
    for (const pad of this.pads) {
      ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      ctx.strokeRect(pad.x, pad.y, pad.w, pad.h);
    }

    this.staticLayer = canvas;
    return canvas;
  }

  /**
   * Update animated pulses and flashes.
   * @param {number} dt
   */
  update(dt) {
    // Spawn new pulses periodically
    this.pulseTimer += dt;
    if (this.pulseTimer > randomRange(0.8, 2.5)) {
      this.pulseTimer = 0;
      if (this.traces.length > 0 && this.pulses.length < 15) {
        const traceIdx = randomInt(0, this.traces.length - 1);
        this.pulses.push({
          traceIdx,
          progress: 0,
          speed: randomRange(0.4, 1.2),
          alive: true
        });
      }
    }

    // Spawn node flashes
    this.flashTimer += dt;
    if (this.flashTimer > randomRange(1.5, 4)) {
      this.flashTimer = 0;
      if (this.nodes.length > 0 && this.nodeFlashes.length < 8) {
        const nodeIdx = randomInt(0, this.nodes.length - 1);
        this.nodeFlashes.push({
          nodeIdx,
          alpha: 0.7,
          decay: randomRange(0.5, 1.5)
        });
      }
    }

    // Update pulses
    for (let i = this.pulses.length - 1; i >= 0; i--) {
      const pulse = this.pulses[i];
      pulse.progress += pulse.speed * dt;
      if (pulse.progress >= 1) {
        this.pulses.splice(i, 1);
      }
    }

    // Update node flashes
    for (let i = this.nodeFlashes.length - 1; i >= 0; i--) {
      const flash = this.nodeFlashes[i];
      flash.alpha -= flash.decay * dt;
      if (flash.alpha <= 0) {
        this.nodeFlashes.splice(i, 1);
      }
    }
  }

  /**
   * Draw animated elements on top of the static layer.
   * @param {CanvasRenderingContext2D} ctx
   */
  drawAnimated(ctx) {
    // Draw pulses traveling along traces
    for (const pulse of this.pulses) {
      const trace = this.traces[pulse.traceIdx];
      if (!trace) continue;
      const pos = this._getPositionOnPath(trace.path, pulse.progress);
      if (!pos) continue;

      const alpha = pulse.progress < 0.1
        ? pulse.progress / 0.1
        : pulse.progress > 0.8
          ? (1 - pulse.progress) / 0.2
          : 1;

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, ${alpha * 0.7})`;
      ctx.shadowColor = `rgba(${COLORS.CYAN_RGB.join(',')}, ${alpha * 0.5})`;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Trail
      const trailPos = this._getPositionOnPath(trace.path, Math.max(0, pulse.progress - 0.08));
      if (trailPos) {
        ctx.beginPath();
        ctx.moveTo(trailPos.x, trailPos.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, ${alpha * 0.3})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // Draw node flashes
    for (const flash of this.nodeFlashes) {
      const node = this.nodes[flash.nodeIdx];
      if (!node) continue;
      ctx.beginPath();
      ctx.arc(node.x, node.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${COLORS.CYAN_RGB.join(',')}, ${flash.alpha * 0.5})`;
      ctx.shadowColor = `rgba(${COLORS.CYAN_RGB.join(',')}, ${flash.alpha})`;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  /**
   * Get interpolated position along a path of points.
   * @param {Array<{x:number,y:number}>} path
   * @param {number} t - 0 to 1
   * @returns {{x:number, y:number}|null}
   */
  _getPositionOnPath(path, t) {
    if (path.length < 2) return path[0] || null;

    // Calculate total length
    let totalLen = 0;
    const segLens = [];
    for (let i = 1; i < path.length; i++) {
      const dx = path[i].x - path[i - 1].x;
      const dy = path[i].y - path[i - 1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      segLens.push(len);
      totalLen += len;
    }
    if (totalLen === 0) return path[0];

    const targetDist = clamp(t, 0, 1) * totalLen;
    let accumulated = 0;
    for (let i = 0; i < segLens.length; i++) {
      if (accumulated + segLens[i] >= targetDist) {
        const segT = (targetDist - accumulated) / segLens[i];
        return {
          x: lerp(path[i].x, path[i + 1].x, segT),
          y: lerp(path[i].y, path[i + 1].y, segT)
        };
      }
      accumulated += segLens[i];
    }
    return path[path.length - 1];
  }
}

// ─── Canvas Engine ──────────────────────────────────────────────────────────────

/**
 * Main canvas rendering engine for NexusFlow.
 * Manages PCB background, overlay effects, particle systems, and the render loop.
 */
class CanvasEngine {
  /**
   * @param {HTMLCanvasElement} pcbCanvas - Background PCB circuit canvas
   * @param {HTMLCanvasElement} effectsCanvas - Overlay effects canvas
   */
  constructor(pcbCanvas, effectsCanvas) {
    /** @type {HTMLCanvasElement} */
    this.pcbCanvas = pcbCanvas;
    /** @type {HTMLCanvasElement} */
    this.effectsCanvas = effectsCanvas;
    /** @type {CanvasRenderingContext2D} */
    this.pcbCtx = pcbCanvas.getContext('2d');
    /** @type {CanvasRenderingContext2D} */
    this.effectsCtx = effectsCanvas.getContext('2d');

    /** @type {PCBCircuit|null} */
    this.pcb = null;
    /** @type {ParticleSystem} */
    this.particles = new ParticleSystem();
    /** @type {Shockwave[]} */
    this.shockwaves = [];
    /** @type {LightningBolt[]} */
    this.lightningBolts = [];
    /** @type {SubmissionCascade[]} */
    this.cascades = [];

    /** @type {number} */
    this.progressLevel = 0;

    /** @type {number|null} */
    this._rafId = null;
    /** @type {number} */
    this._lastTime = 0;
    /** @type {boolean} */
    this._running = false;
    /** @type {boolean} */
    this._visible = true;

    // Bind methods
    this._tick = this._tick.bind(this);
    this._onResize = this._onResize.bind(this);
    this._onVisibility = this._onVisibility.bind(this);
  }

  /** Initialize both canvases and start the render loop. */
  init() {
    this._syncCanvasSize();
    this._buildPCB();

    // Event listeners
    window.addEventListener('resize', this._onResize);
    document.addEventListener('visibilitychange', this._onVisibility);

    // Start loop
    this._running = true;
    this._lastTime = performance.now();
    this._rafId = requestAnimationFrame(this._tick);
  }

  /** Synchronize canvas dimensions with their display size. */
  _syncCanvasSize() {
    const dpr = window.devicePixelRatio || 1;

    for (const canvas of [this.pcbCanvas, this.effectsCanvas]) {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  /** Generate the PCB circuit layout and render static layer. */
  _buildPCB() {
    const rect = this.pcbCanvas.getBoundingClientRect();
    this.pcb = new PCBCircuit(rect.width, rect.height);
    this.pcb.renderStaticLayer();
    this._drawPCBStatic();
  }

  /** Blit the static PCB layer to the pcb canvas. */
  _drawPCBStatic() {
    if (!this.pcb || !this.pcb.staticLayer) return;
    this.pcbCtx.save();
    this.pcbCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.pcbCtx.clearRect(0, 0, this.pcbCanvas.width, this.pcbCanvas.height);
    this.pcbCtx.drawImage(this.pcb.staticLayer, 0, 0);
    this.pcbCtx.restore();
  }

  /** Handle window resize. */
  resize() {
    this._onResize();
  }

  /** @private */
  _onResize() {
    this._syncCanvasSize();
    this._buildPCB();
  }

  /** @private */
  _onVisibility() {
    this._visible = !document.hidden;
    if (this._visible && this._running) {
      this._lastTime = performance.now();
      this._rafId = requestAnimationFrame(this._tick);
    }
  }

  /**
   * Main render loop tick.
   * @param {number} now - timestamp from requestAnimationFrame
   */
  _tick(now) {
    if (!this._running || !this._visible) return;

    const dt = Math.min((now - this._lastTime) / 1000, 0.05); // Cap at 50ms
    this._lastTime = now;

    this._update(dt);
    this._draw();

    this._rafId = requestAnimationFrame(this._tick);
  }

  /**
   * Update all systems.
   * @param {number} dt
   */
  _update(dt) {
    // PCB pulses
    if (this.pcb) this.pcb.update(dt);

    // Particles
    this.particles.update(dt);

    // Shockwaves
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      this.shockwaves[i].update(dt);
      if (this.shockwaves[i].isDead) this.shockwaves.splice(i, 1);
    }

    // Lightning
    for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
      this.lightningBolts[i].update(dt);
      if (this.lightningBolts[i].isDead) this.lightningBolts.splice(i, 1);
    }

    // Cascades
    for (let i = this.cascades.length - 1; i >= 0; i--) {
      this.cascades[i].update(dt);
      if (this.cascades[i].isDead) this.cascades.splice(i, 1);
    }
  }

  /** Render all visual layers. */
  _draw() {
    // PCB: redraw static + animated overlay
    this._drawPCBStatic();
    if (this.pcb) {
      const dpr = window.devicePixelRatio || 1;
      this.pcbCtx.save();
      this.pcbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Do NOT clear - static is already drawn, draw animated on top
      this.pcb.drawAnimated(this.pcbCtx);
      this.pcbCtx.restore();
    }

    // Effects canvas: clear and redraw everything
    const ectx = this.effectsCtx;
    ectx.save();
    const dpr = window.devicePixelRatio || 1;
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.clearRect(0, 0, this.effectsCanvas.width, this.effectsCanvas.height);
    ectx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Shockwaves
    for (const sw of this.shockwaves) sw.draw(ectx);

    // Lightning
    for (const lb of this.lightningBolts) lb.draw(ectx);

    // Particles
    this.particles.draw(ectx);

    // Cascade sink flashes
    for (const cascade of this.cascades) cascade.drawFlashes(ectx);

    // Fluid progress overlay (subtle)
    this._drawFluidOverlay(ectx);

    ectx.restore();
  }

  /**
   * Draw a subtle fluid shimmer overlay for the progress tube area.
   * This adds a bioluminescent ripple effect on top of the CSS progress bar.
   * @param {CanvasRenderingContext2D} ctx
   */
  _drawFluidOverlay(ctx) {
    if (this.progressLevel <= 0) return;

    // Find the progress tube element if it exists
    const tube = document.querySelector('[data-progress-tube]');
    if (!tube) return;

    const rect = tube.getBoundingClientRect();
    const canvasRect = this.effectsCanvas.getBoundingClientRect();
    const x = rect.left - canvasRect.left;
    const y = rect.top - canvasRect.top;
    const w = rect.width;
    const h = rect.height;
    const fillW = w * this.progressLevel;

    if (fillW <= 0) return;

    const now = performance.now() / 1000;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // Subtle moving wave highlights
    for (let i = 0; i < 3; i++) {
      const waveX = x + (Math.sin(now * (1.5 + i * 0.5) + i * 2) * 0.5 + 0.5) * fillW;
      const waveY = y + h / 2 + Math.sin(now * 2 + i) * (h * 0.2);
      const gradient = ctx.createRadialGradient(waveX, waveY, 0, waveX, waveY, 20);
      gradient.addColorStop(0, `rgba(${COLORS.CYAN_RGB.join(',')}, 0.15)`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, fillW, h);
    }

    ctx.restore();
  }

  // ─── Public Effect Triggers ─────────────────────────────────────────────────

  /**
   * Trigger an electric shockwave at the given position.
   * Used when a form component is dropped into the builder.
   * @param {number} x - X coordinate (CSS pixels relative to effects canvas)
   * @param {number} y - Y coordinate (CSS pixels relative to effects canvas)
   */
  triggerShockwave(x, y) {
    // Add expanding ring
    this.shockwaves.push(new Shockwave(x, y, 200, 0.6, COLORS.CYAN_RGB));

    // Spawn 8-12 spark particles flying outward
    this.particles.emit({
      x, y,
      count: randomInt(8, 12),
      rgb: COLORS.CYAN_RGB,
      radiusMin: 1.5,
      radiusMax: 3,
      speedMin: 120,
      speedMax: 300,
      lifeMin: 0.25,
      lifeMax: 0.45,
      glow: 10,
      angleMin: 0,
      angleMax: Math.PI * 2
    });

    // Secondary smaller ring for depth
    setTimeout(() => {
      if (this._running) {
        this.shockwaves.push(new Shockwave(x, y, 120, 0.4, COLORS.PURPLE_RGB));
      }
    }, 80);
  }

  /**
   * Trigger an error flash with lightning at the given position.
   * Used when a validation error occurs on a form component.
   * @param {number} x - X coordinate
   * @param {number} y - Y coordinate
   */
  triggerErrorFlash(x, y) {
    // Lightning bolt
    this.lightningBolts.push(new LightningBolt(x, y, COLORS.ERROR_RGB));

    // Red particle burst
    this.particles.emit({
      x, y,
      count: randomInt(10, 18),
      rgb: COLORS.ERROR_RGB,
      radiusMin: 1,
      radiusMax: 3,
      speedMin: 50,
      speedMax: 180,
      lifeMin: 0.2,
      lifeMax: 0.5,
      glow: 8,
      angleMin: 0,
      angleMax: Math.PI * 2
    });

    // Screen flash: brief red overlay
    const ectx = this.effectsCtx;
    ectx.save();
    ectx.fillStyle = `rgba(${COLORS.ERROR_RGB.join(',')}, 0.06)`;
    const rect = this.effectsCanvas.getBoundingClientRect();
    ectx.fillRect(0, 0, rect.width, rect.height);
    ectx.restore();
  }

  /**
   * Start submission particle cascade from source elements to data sink.
   * Particles flow from each question block to the reactor sink.
   * @param {Array<{x:number,y:number,width:number,height:number}>} sourceRects
   * @param {{x:number,y:number,width:number,height:number}} sinkRect
   */
  triggerSubmission(sourceRects, sinkRect) {
    if (!sourceRects || sourceRects.length === 0 || !sinkRect) return;
    const cascade = new SubmissionCascade(sourceRects, sinkRect, this.particles);
    this.cascades.push(cascade);
  }

  /**
   * Update the progress tube fill level.
   * @param {number} percent - Fill level from 0 to 1
   */
  updateProgress(percent) {
    this.progressLevel = clamp(percent, 0, 1);
  }

  /** Clean up all resources and stop the render loop. */
  destroy() {
    this._running = false;
    if (this._rafId !== null) {
      cancelAnimationFrame(this._rafId);
      this._rafId = null;
    }
    window.removeEventListener('resize', this._onResize);
    document.removeEventListener('visibilitychange', this._onVisibility);

    // Clear canvases
    this.pcbCtx.clearRect(0, 0, this.pcbCanvas.width, this.pcbCanvas.height);
    this.effectsCtx.clearRect(0, 0, this.effectsCanvas.width, this.effectsCanvas.height);

    // Release references
    this.pcb = null;
    this.particles = new ParticleSystem();
    this.shockwaves = [];
    this.lightningBolts = [];
    this.cascades = [];
  }
}

export default CanvasEngine;

/**
 * @fileoverview NexusFlow UI Module
 * Renders all UI components for the NexusFlow Sovereign Form Architect:
 *   - Component Fabricator (left panel, drag source)
 *   - Hydration Canvas question blocks (center)
 *   - Logic Controller (right panel)
 *   - Respondent Mode (form preview / fill)
 *   - Audio Engine (Web Audio API synth sounds)
 *   - Toast Notification system
 *
 * @module ui
 */

// ─────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────

/**
 * All supported question types with metadata.
 * @type {Array<{type: string, label: string, icon: string, desc: string}>}
 */
const QUESTION_TYPES = [
  { type: 'short-answer', label: 'Short Answer', icon: '⌨', desc: 'Single line text input' },
  { type: 'paragraph',    label: 'Paragraph',    icon: '📝', desc: 'Multi-line text response' },
  { type: 'multiple-choice', label: 'Multiple Choice', icon: '◉', desc: 'Select one option' },
  { type: 'checkbox',     label: 'Checkboxes',   icon: '☑', desc: 'Select multiple options' },
  { type: 'dropdown',     label: 'Dropdown',      icon: '▾', desc: 'Choose from a list' },
  { type: 'file-upload',  label: 'File Upload',   icon: '⬆', desc: 'Upload attachment' },
  { type: 'date',         label: 'Date',          icon: '📅', desc: 'Date selector' },
  { type: 'scale',        label: 'Linear Scale',  icon: '◈', desc: 'Rating scale 1-10' },
];

/** Map type string → QUESTION_TYPES entry for O(1) lookups */
const TYPE_MAP = Object.freeze(
  QUESTION_TYPES.reduce((m, qt) => { m[qt.type] = qt; return m; }, {})
);

/** Toast icon map */
const TOAST_ICONS = { info: 'ℹ', success: '✓', error: '✗' };

// ─────────────────────────────────────────────
// Audio Engine
// ─────────────────────────────────────────────

/**
 * Synthesizes short UI sound effects via Web Audio API.
 * Lazy-initialises the AudioContext on first user interaction.
 */
class AudioEngine {
  constructor() {
    /** @type {AudioContext|null} */
    this.ctx = null;
    /** @type {boolean} */
    this.enabled = true;
    /** @type {number} last hover timestamp for debounce */
    this._lastHover = 0;
  }

  /** Create the AudioContext (call once after a user gesture). */
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (_) {
      this.enabled = false;
    }
  }

  /**
   * Play a named sound effect.
   * @param {'click'|'drop'|'error'|'success'|'hover'} type
   */
  play(type) {
    if (!this.enabled) return;
    // Lazy init on first audible interaction
    if (!this.ctx) this.init();
    if (!this.ctx) return;

    switch (type) {
      case 'click':   this._playClick(); break;
      case 'drop':    this._playDrop(); break;
      case 'error':   this._playError(); break;
      case 'success': this._playSuccess(); break;
      case 'hover':   this._playHover(); break;
    }
  }

  /* ── Individual synth recipes ───────────────── */

  /** Short high-freq tick */
  _playClick() {
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, t);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.03);
  }

  /** Medium bass thump + sparkle overlay */
  _playDrop() {
    const t = this.ctx.currentTime;

    // Bass thump
    const bass = this.ctx.createOscillator();
    const bassGain = this.ctx.createGain();
    bass.type = 'sine';
    bass.frequency.setValueAtTime(150, t);
    bass.frequency.exponentialRampToValueAtTime(60, t + 0.15);
    bassGain.gain.setValueAtTime(0.12, t);
    bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    bass.connect(bassGain).connect(this.ctx.destination);
    bass.start(t);
    bass.stop(t + 0.15);

    // High sparkle
    const sparkle = this.ctx.createOscillator();
    const spkGain = this.ctx.createGain();
    sparkle.type = 'sine';
    sparkle.frequency.setValueAtTime(2000, t);
    sparkle.frequency.exponentialRampToValueAtTime(3000, t + 0.05);
    spkGain.gain.setValueAtTime(0.04, t);
    spkGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    sparkle.connect(spkGain).connect(this.ctx.destination);
    sparkle.start(t);
    sparkle.stop(t + 0.05);
  }

  /** Low sawtooth buzz with gain wobble */
  _playError() {
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, t);
    gain.gain.setValueAtTime(0.1, t);
    // wobble
    gain.gain.linearRampToValueAtTime(0.04, t + 0.05);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.1);
    gain.gain.linearRampToValueAtTime(0.04, t + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.2);
  }

  /** Ascending dual-tone sweep */
  _playSuccess() {
    const t = this.ctx.currentTime;

    const lo = this.ctx.createOscillator();
    const loG = this.ctx.createGain();
    lo.type = 'sine';
    lo.frequency.setValueAtTime(500, t);
    lo.frequency.exponentialRampToValueAtTime(800, t + 0.2);
    loG.gain.setValueAtTime(0.08, t);
    loG.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    lo.connect(loG).connect(this.ctx.destination);
    lo.start(t);
    lo.stop(t + 0.2);

    const hi = this.ctx.createOscillator();
    const hiG = this.ctx.createGain();
    hi.type = 'sine';
    hi.frequency.setValueAtTime(700, t + 0.05);
    hi.frequency.exponentialRampToValueAtTime(1100, t + 0.2);
    hiG.gain.setValueAtTime(0.05, t + 0.05);
    hiG.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    hi.connect(hiG).connect(this.ctx.destination);
    hi.start(t + 0.05);
    hi.stop(t + 0.22);
  }

  /** Very subtle, barely-audible tick for hover */
  _playHover() {
    const now = performance.now();
    if (now - this._lastHover < 80) return;   // debounce 80 ms
    this._lastHover = now;

    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, t);
    gain.gain.setValueAtTime(0.025, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.015);
  }
}

// ─────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────

/**
 * Pad a number to two digits: 1 → "01".
 * @param {number} n
 * @returns {string}
 */
function pad2(n) {
  return String(n).padStart(2, '0');
}

/**
 * Create a DOM element with optional className and textContent.
 * @param {string} tag
 * @param {string} [className]
 * @param {string} [text]
 * @returns {HTMLElement}
 */
function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

/**
 * Determine whether a question type has user-editable options.
 * @param {string} type
 * @returns {boolean}
 */
function hasOptions(type) {
  return ['multiple-choice', 'checkbox', 'dropdown'].includes(type);
}

// ─────────────────────────────────────────────
// NexusFlowUI
// ─────────────────────────────────────────────

/**
 * Main UI class for the NexusFlow form builder.
 * All rendering, interaction logic, audio, and toast notifications
 * are encapsulated here.
 *
 * Communication with the data layer happens through an EventTarget bus.
 */
class NexusFlowUI {
  /**
   * @param {EventTarget} eventBus - shared event bus for cross-module comms
   */
  constructor(eventBus) {
    /** @type {EventTarget} */
    this.eventBus = eventBus;

    /** @type {AudioEngine} */
    this.audio = new AudioEngine();

    /**
     * Map of questionId → DOM element for quick lookups.
     * @type {Map<string, HTMLElement>}
     */
    this._blockElements = new Map();

    /**
     * Currently-active (selected) question id.
     * @type {string|null}
     */
    this._activeQuestionId = null;

    /** Hover sound debounce tracker */
    this._lastHoverSoundTime = 0;
  }

  // ═══════════════════════════════════════════
  // 1. FABRICATOR PANEL
  // ═══════════════════════════════════════════

  /**
   * Render the Component Fabricator panel into a container.
   * Creates draggable module cards for each question type.
   * @param {HTMLElement} container
   */
  renderFabricator(container) {
    container.innerHTML = '';

    // ── Panel header ──
    const header = el('div', 'panel-header');
    const headerIcon = el('span', 'panel-header__icon', '⚙');
    const headerTitle = el('span', 'panel-header__title', 'COMPONENT FABRICATOR');
    header.append(headerIcon, headerTitle);
    container.appendChild(header);

    // ── Module list ──
    const modules = el('div', 'fabricator-modules');

    for (const qt of QUESTION_TYPES) {
      const card = el('div', 'module-card');
      card.draggable = true;
      card.dataset.type = qt.type;

      const icon = el('div', 'module-card__icon', qt.icon);
      const info = el('div', 'module-card__info');
      const label = el('div', 'module-card__label', qt.label);
      const desc  = el('div', 'module-card__desc', qt.desc);
      info.append(label, desc);
      card.append(icon, info);

      // ── Drag events ──
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/nexusflow-type', qt.type);
        e.dataTransfer.effectAllowed = 'copy';
        card.classList.add('dragging');
        this.playSound('click');
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });

      // ── Hover sound (debounced via AudioEngine) ──
      card.addEventListener('mouseenter', () => {
        this.playSound('hover');
      });

      modules.appendChild(card);
    }

    container.appendChild(modules);
  }

  // ═══════════════════════════════════════════
  // 2. QUESTION BLOCKS
  // ═══════════════════════════════════════════

  /**
   * Create and return a new question-block DOM element.
   * The element is also stored in the internal map.
   *
   * @param {Object} question - question data object
   * @returns {HTMLElement} the created block element
   */
  createQuestionBlock(question) {
    const meta = TYPE_MAP[question.type] || QUESTION_TYPES[0];
    const block = el('div', 'question-block');
    block.dataset.questionId = question.id;
    block.dataset.type = question.type;

    // ── Number badge ──
    const number = el('div', 'question-block__number', pad2((question.order ?? 0) + 1));
    block.appendChild(number);

    // ── Header row ──
    const header = el('div', 'question-block__header');
    const titleInput = document.createElement('input');
    titleInput.className = 'question-block__title-input';
    titleInput.value = question.title || '';
    titleInput.placeholder = 'Enter your question...';
    titleInput.setAttribute('aria-label', 'Question title');

    const badge = el('div', 'question-block__type-badge', `${meta.icon} ${meta.label}`);
    header.append(titleInput, badge);
    block.appendChild(header);

    // ── Description ──
    const descInput = document.createElement('input');
    descInput.className = 'question-block__desc-input';
    descInput.value = question.description || '';
    descInput.placeholder = 'Add description (optional)';
    descInput.setAttribute('aria-label', 'Question description');
    block.appendChild(descInput);

    // ── Type-specific content ──
    const content = el('div', 'question-block__content');
    this._renderTypeContent(content, question, false);
    block.appendChild(content);

    // ── Toolbar ──
    const toolbar = el('div', 'question-block__toolbar');

    // Required toggle
    const reqLabel = document.createElement('label');
    reqLabel.className = 'question-block__required';
    const reqCheckbox = document.createElement('input');
    reqCheckbox.type = 'checkbox';
    reqCheckbox.checked = !!question.required;
    reqLabel.append(reqCheckbox, document.createTextNode(' Required'));
    toolbar.appendChild(reqLabel);

    // Duplicate button
    const dupeBtn = el('button', 'cyber-btn cyber-btn--icon', '⧉');
    dupeBtn.title = 'Duplicate';
    toolbar.appendChild(dupeBtn);

    // Delete button
    const delBtn = el('button', 'cyber-btn cyber-btn--icon cyber-btn--danger', '✕');
    delBtn.title = 'Delete';
    toolbar.appendChild(delBtn);

    block.appendChild(toolbar);

    // ── Wire events ──
    this._bindBlockEvents(block, question);

    // Store reference
    this._blockElements.set(question.id, block);

    return block;
  }

  /**
   * Update an existing question block in-place.
   * Re-renders number, title, description, type content, and required state.
   *
   * @param {string} questionId
   * @param {Object} question - updated question data
   */
  updateQuestionBlock(questionId, question) {
    const block = this._blockElements.get(questionId);
    if (!block) return;

    const meta = TYPE_MAP[question.type] || QUESTION_TYPES[0];

    // Number
    const numberEl = block.querySelector('.question-block__number');
    if (numberEl) numberEl.textContent = pad2((question.order ?? 0) + 1);

    // Title
    const titleEl = block.querySelector('.question-block__title-input');
    if (titleEl && document.activeElement !== titleEl) {
      titleEl.value = question.title || '';
    }

    // Description
    const descEl = block.querySelector('.question-block__desc-input');
    if (descEl && document.activeElement !== descEl) {
      descEl.value = question.description || '';
    }

    // Badge
    const badgeEl = block.querySelector('.question-block__type-badge');
    if (badgeEl) badgeEl.textContent = `${meta.icon} ${meta.label}`;

    // Type-specific content
    const contentEl = block.querySelector('.question-block__content');
    if (contentEl) {
      contentEl.innerHTML = '';
      this._renderTypeContent(contentEl, question, false);
    }

    // Required
    const reqCheckbox = block.querySelector('.question-block__required input[type="checkbox"]');
    if (reqCheckbox) reqCheckbox.checked = !!question.required;

    // Update data attrs
    block.dataset.type = question.type;
  }

  /**
   * Remove a question block from DOM and internal map.
   * @param {string} questionId
   */
  removeQuestionBlock(questionId) {
    const block = this._blockElements.get(questionId);
    if (block) {
      block.classList.add('question-block--removing');
      // Animate out then remove
      setTimeout(() => {
        block.remove();
        this._blockElements.delete(questionId);
      }, 300);
    }
    if (this._activeQuestionId === questionId) {
      this._activeQuestionId = null;
    }
  }

  // ── Private: type-specific content renderers ──

  /**
   * Render type-specific content into a container.
   * @param {HTMLElement} container
   * @param {Object} question
   * @param {boolean} respondentMode - if true, inputs are enabled
   * @private
   */
  _renderTypeContent(container, question, respondentMode) {
    switch (question.type) {
      case 'short-answer': this._renderShortAnswer(container, question, respondentMode); break;
      case 'paragraph':    this._renderParagraph(container, question, respondentMode); break;
      case 'multiple-choice': this._renderMultipleChoice(container, question, respondentMode); break;
      case 'checkbox':     this._renderCheckbox(container, question, respondentMode); break;
      case 'dropdown':     this._renderDropdown(container, question, respondentMode); break;
      case 'file-upload':  this._renderFileUpload(container, question, respondentMode); break;
      case 'date':         this._renderDate(container, question, respondentMode); break;
      case 'scale':        this._renderScale(container, question, respondentMode); break;
      default:             this._renderShortAnswer(container, question, respondentMode); break;
    }
  }

  /**
   * Short Answer renderer
   * @private
   */
  _renderShortAnswer(container, question, respondentMode) {
    const wrapper = el('div', 'laser-input');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Short answer text';
    input.disabled = !respondentMode;
    if (respondentMode) {
      input.dataset.questionId = question.id;
      input.addEventListener('input', () => {
        this._emitRespondentInput(question.id, input.value);
      });
    }
    wrapper.appendChild(input);
    container.appendChild(wrapper);
  }

  /**
   * Paragraph renderer
   * @private
   */
  _renderParagraph(container, question, respondentMode) {
    const wrapper = el('div', 'laser-input laser-input--multi');
    const textarea = document.createElement('textarea');
    textarea.placeholder = 'Long answer text';
    textarea.rows = 3;
    textarea.disabled = !respondentMode;
    if (respondentMode) {
      textarea.dataset.questionId = question.id;
      textarea.addEventListener('input', () => {
        this._emitRespondentInput(question.id, textarea.value);
      });
    }
    wrapper.appendChild(textarea);
    container.appendChild(wrapper);
  }

  /**
   * Multiple Choice renderer
   * @private
   */
  _renderMultipleChoice(container, question, respondentMode) {
    const options = question.options || ['Option 1', 'Option 2'];
    const list = el('div', 'options-list');

    options.forEach((opt, i) => {
      const row = el('div', 'reactor-radio');
      row.dataset.index = String(i);

      const core = el('div', 'reactor-radio__core');

      if (respondentMode) {
        // Clickable radio in respondent mode
        row.addEventListener('click', () => {
          list.querySelectorAll('.reactor-radio').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          this.playSound('click');
          this._emitRespondentInput(question.id, opt);
        });
        const labelSpan = el('span', 'reactor-radio__label-text', opt);
        row.append(core, labelSpan);
      } else {
        // Editable label in builder mode
        const labelInput = document.createElement('input');
        labelInput.className = 'reactor-radio__label-input';
        labelInput.value = opt;
        labelInput.addEventListener('change', () => {
          this._emitOptionChange(question.id, i, labelInput.value);
        });

        const removeBtn = el('button', 'option-remove', '✕');
        removeBtn.addEventListener('click', () => {
          this._emitOptionRemove(question.id, i);
        });

        // Preview select in builder
        core.addEventListener('click', () => {
          list.querySelectorAll('.reactor-radio').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          this.playSound('click');
        });

        row.append(core, labelInput, removeBtn);
      }

      list.appendChild(row);
    });

    if (!respondentMode) {
      const addBtn = el('button', 'add-option-btn cyber-btn', '+ Add Option');
      addBtn.addEventListener('click', () => {
        this._emitOptionAdd(question.id);
        this.playSound('click');
      });
      list.appendChild(addBtn);
    }

    container.appendChild(list);
  }

  /**
   * Checkbox renderer
   * @private
   */
  _renderCheckbox(container, question, respondentMode) {
    const options = question.options || ['Option 1', 'Option 2'];
    const list = el('div', 'options-list');

    options.forEach((opt, i) => {
      const row = el('div', 'reactor-checkbox');
      row.dataset.index = String(i);

      const core = el('div', 'reactor-checkbox__core');

      if (respondentMode) {
        row.addEventListener('click', () => {
          row.classList.toggle('selected');
          this.playSound('click');
          const selected = Array.from(list.querySelectorAll('.reactor-checkbox.selected'))
            .map(r => options[parseInt(r.dataset.index, 10)]);
          this._emitRespondentInput(question.id, selected);
        });
        const labelSpan = el('span', 'reactor-checkbox__label-text', opt);
        row.append(core, labelSpan);
      } else {
        const labelInput = document.createElement('input');
        labelInput.className = 'reactor-checkbox__label-input';
        labelInput.value = opt;
        labelInput.addEventListener('change', () => {
          this._emitOptionChange(question.id, i, labelInput.value);
        });

        const removeBtn = el('button', 'option-remove', '✕');
        removeBtn.addEventListener('click', () => {
          this._emitOptionRemove(question.id, i);
        });

        core.addEventListener('click', () => {
          row.classList.toggle('selected');
          this.playSound('click');
        });

        row.append(core, labelInput, removeBtn);
      }

      list.appendChild(row);
    });

    if (!respondentMode) {
      const addBtn = el('button', 'add-option-btn cyber-btn', '+ Add Option');
      addBtn.addEventListener('click', () => {
        this._emitOptionAdd(question.id);
        this.playSound('click');
      });
      list.appendChild(addBtn);
    }

    container.appendChild(list);
  }

  /**
   * Dropdown renderer
   * @private
   */
  _renderDropdown(container, question, respondentMode) {
    const options = question.options || ['Option 1', 'Option 2'];

    if (respondentMode) {
      const wrapper = el('div', 'mech-dropdown-preview');
      const select = document.createElement('select');
      select.className = 'mech-dropdown__select';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select an option…';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);

      options.forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        select.appendChild(o);
      });

      select.addEventListener('change', () => {
        this.playSound('click');
        this._emitRespondentInput(question.id, select.value);
      });

      wrapper.appendChild(select);
      container.appendChild(wrapper);
    } else {
      const wrapper = el('div', 'mech-dropdown-preview');
      const list = el('div', 'options-list');

      options.forEach((opt, i) => {
        const row = el('div', 'reactor-radio');
        row.dataset.index = String(i);

        const indexLabel = el('span', 'dropdown-index', `${i + 1}.`);

        const labelInput = document.createElement('input');
        labelInput.className = 'reactor-radio__label-input';
        labelInput.value = opt;
        labelInput.addEventListener('change', () => {
          this._emitOptionChange(question.id, i, labelInput.value);
        });

        const removeBtn = el('button', 'option-remove', '✕');
        removeBtn.addEventListener('click', () => {
          this._emitOptionRemove(question.id, i);
        });

        row.append(indexLabel, labelInput, removeBtn);
        list.appendChild(row);
      });

      const addBtn = el('button', 'add-option-btn cyber-btn', '+ Add Option');
      addBtn.addEventListener('click', () => {
        this._emitOptionAdd(question.id);
        this.playSound('click');
      });
      list.appendChild(addBtn);

      wrapper.appendChild(list);
      container.appendChild(wrapper);
    }
  }

  /**
   * File Upload renderer
   * @private
   */
  _renderFileUpload(container, question, respondentMode) {
    const hatch = el('div', 'hatch-upload');
    const hatchIcon = el('div', 'hatch-upload__icon', '⬆');
    const hatchText = el('div', 'hatch-upload__text', 'Drag files here or click to upload');
    const hatchFormats = el('div', 'hatch-upload__formats', 'Supported: PDF, DOC, IMG');
    hatch.append(hatchIcon, hatchText, hatchFormats);

    if (respondentMode) {
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.className = 'hatch-upload__input';
      fileInput.style.display = 'none';
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          hatchText.textContent = fileInput.files[0].name;
          hatch.classList.add('hatch-upload--filled');
          this.playSound('success');
          this._emitRespondentInput(question.id, fileInput.files[0].name);
        }
      });
      hatch.appendChild(fileInput);
      hatch.addEventListener('click', () => fileInput.click());
      hatch.style.cursor = 'pointer';

      // Drag & drop visual feedback
      hatch.addEventListener('dragover', (e) => {
        e.preventDefault();
        hatch.classList.add('hatch-upload--dragover');
      });
      hatch.addEventListener('dragleave', () => {
        hatch.classList.remove('hatch-upload--dragover');
      });
      hatch.addEventListener('drop', (e) => {
        e.preventDefault();
        hatch.classList.remove('hatch-upload--dragover');
        if (e.dataTransfer.files.length) {
          hatchText.textContent = e.dataTransfer.files[0].name;
          hatch.classList.add('hatch-upload--filled');
          this.playSound('success');
          this._emitRespondentInput(question.id, e.dataTransfer.files[0].name);
        }
      });
    }

    container.appendChild(hatch);
  }

  /**
   * Date renderer
   * @private
   */
  _renderDate(container, question, respondentMode) {
    const wrapper = el('div', 'laser-input');
    const input = document.createElement('input');
    input.type = 'date';
    input.disabled = !respondentMode;
    if (respondentMode) {
      input.dataset.questionId = question.id;
      input.addEventListener('change', () => {
        this.playSound('click');
        this._emitRespondentInput(question.id, input.value);
      });
    }
    wrapper.appendChild(input);
    container.appendChild(wrapper);
  }

  /**
   * Linear Scale renderer (1-10)
   * @private
   */
  _renderScale(container, question, respondentMode) {
    const scaleContainer = el('div', 'scale-container');
    const labelLow = el('span', 'scale-label', '1');
    const points = el('div', 'scale-points');
    const labelHigh = el('span', 'scale-label', '10');

    for (let v = 1; v <= 10; v++) {
      const point = el('div', 'scale-point');
      point.dataset.value = String(v);
      const core = el('div', 'reactor-radio__core');
      const valueLabel = el('span', 'scale-point__value', String(v));
      point.append(core, valueLabel);

      point.addEventListener('click', () => {
        points.querySelectorAll('.scale-point').forEach(p => p.classList.remove('selected'));
        point.classList.add('selected');
        this.playSound('click');
        if (respondentMode) {
          this._emitRespondentInput(question.id, v);
        }
      });

      points.appendChild(point);
    }

    scaleContainer.append(labelLow, points, labelHigh);
    container.appendChild(scaleContainer);
  }

  // ── Private: event binding for question blocks ──

  /**
   * Bind all interactive events for a question block.
   * @param {HTMLElement} block
   * @param {Object} question
   * @private
   */
  _bindBlockEvents(block, question) {
    const qid = question.id;

    // ── Block selection ──
    block.addEventListener('click', (e) => {
      // Don't select when interacting with inputs/buttons inside
      if (e.target.closest('input, button, textarea, select, label')) return;

      this._setActiveBlock(qid);
    });

    // ── Title change ──
    const titleInput = block.querySelector('.question-block__title-input');
    if (titleInput) {
      titleInput.addEventListener('input', () => {
        this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
          detail: { id: qid, field: 'title', value: titleInput.value }
        }));
      });
      titleInput.addEventListener('focus', () => this._setActiveBlock(qid));
    }

    // ── Description change ──
    const descInput = block.querySelector('.question-block__desc-input');
    if (descInput) {
      descInput.addEventListener('input', () => {
        this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
          detail: { id: qid, field: 'description', value: descInput.value }
        }));
      });
      descInput.addEventListener('focus', () => this._setActiveBlock(qid));
    }

    // ── Required toggle ──
    const reqCheckbox = block.querySelector('.question-block__required input[type="checkbox"]');
    if (reqCheckbox) {
      reqCheckbox.addEventListener('change', () => {
        this.playSound('click');
        this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
          detail: { id: qid, field: 'required', value: reqCheckbox.checked }
        }));
      });
    }

    // ── Delete ──
    const delBtn = block.querySelector('.cyber-btn--danger');
    if (delBtn) {
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.playSound('click');
        this.eventBus.dispatchEvent(new CustomEvent('question:removed', {
          detail: { id: qid }
        }));
      });
    }

    // ── Duplicate ──
    const dupeBtn = block.querySelector('.cyber-btn--icon:not(.cyber-btn--danger)');
    if (dupeBtn) {
      dupeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.playSound('click');
        this.eventBus.dispatchEvent(new CustomEvent('question:duplicated', {
          detail: { id: qid }
        }));
      });
    }
  }

  /**
   * Set a block as active (selected) and deselect the previous.
   * @param {string} questionId
   * @private
   */
  _setActiveBlock(questionId) {
    if (this._activeQuestionId === questionId) return;

    // Deselect previous
    if (this._activeQuestionId) {
      const prev = this._blockElements.get(this._activeQuestionId);
      if (prev) prev.classList.remove('active');
    }

    this._activeQuestionId = questionId;
    const block = this._blockElements.get(questionId);
    if (block) {
      block.classList.add('active');
      this.playSound('click');
    }

    this.eventBus.dispatchEvent(new CustomEvent('question:selected', {
      detail: { id: questionId }
    }));
  }

  // ── Private: option mutation emitters ──

  /** @private */
  _emitOptionChange(questionId, index, value) {
    this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
      detail: { id: questionId, field: 'option', index, value }
    }));
  }

  /** @private */
  _emitOptionRemove(questionId, index) {
    this.playSound('click');
    this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
      detail: { id: questionId, field: 'option-remove', index }
    }));
  }

  /** @private */
  _emitOptionAdd(questionId) {
    this.eventBus.dispatchEvent(new CustomEvent('question:updated', {
      detail: { id: questionId, field: 'option-add' }
    }));
  }

  /** @private */
  _emitRespondentInput(questionId, value) {
    this.eventBus.dispatchEvent(new CustomEvent('respondent:input', {
      detail: { id: questionId, value }
    }));
  }

  // ═══════════════════════════════════════════
  // 3. LOGIC PANEL
  // ═══════════════════════════════════════════

  /**
   * Render the Logic Controller panel.
   * Shows question nodes and existing branch rules.
   *
   * @param {HTMLElement} container
   * @param {Object[]} questions - array of question data objects
   * @param {Object[]} branches - array of {id, fromId, toId, condition}
   */
  renderLogicPanel(container, questions, branches) {
    container.innerHTML = '';

    // ── Panel header ──
    const header = el('div', 'panel-header');
    const headerIcon = el('span', 'panel-header__icon', '⚡');
    const headerTitle = el('span', 'panel-header__title', 'LOGIC CONTROLLER');
    header.append(headerIcon, headerTitle);
    container.appendChild(header);

    // ── Question nodes ──
    const nodesContainer = el('div', 'logic-nodes');

    if (questions.length === 0) {
      const empty = el('div', 'logic-nodes__empty', 'No questions yet. Drag components from the Fabricator to begin.');
      nodesContainer.appendChild(empty);
    } else {
      questions.forEach((q, i) => {
        const meta = TYPE_MAP[q.type] || QUESTION_TYPES[0];
        const node = el('div', 'logic-node');
        node.dataset.questionId = q.id;

        const dot = el('div', 'logic-node__dot');
        // Cycle through accent colours for visual distinction
        const hue = (i * 40 + 180) % 360;
        dot.style.background = `hsl(${hue}, 90%, 55%)`;

        const title = el('div', 'logic-node__title', q.title || `Question ${i + 1}`);
        const type  = el('div', 'logic-node__type', `${meta.icon} ${meta.label}`);

        node.append(dot, title, type);
        nodesContainer.appendChild(node);
      });
    }

    container.appendChild(nodesContainer);

    // ── Branch rules ──
    const branchContainer = el('div', 'logic-branches');

    if (branches && branches.length > 0) {
      const questionOrderMap = new Map();
      questions.forEach((q, i) => questionOrderMap.set(q.id, i + 1));

      branches.forEach((branch) => {
        const branchEl = el('div', 'logic-branch');
        branchEl.dataset.branchId = branch.id;

        const fromLabel = el('span', 'logic-branch__from', `Q${questionOrderMap.get(branch.fromId) || '?'}`);
        const arrow1    = el('span', 'logic-branch__arrow', '→');
        const condition = el('span', 'logic-branch__condition', branch.condition || 'any');
        const arrow2    = el('span', 'logic-branch__arrow', '→');
        const toLabel   = el('span', 'logic-branch__to', `Q${questionOrderMap.get(branch.toId) || '?'}`);

        const removeBtn = el('button', 'logic-branch__remove', '✕');
        removeBtn.addEventListener('click', () => {
          this.playSound('click');
          this.eventBus.dispatchEvent(new CustomEvent('logic:branch-removed', {
            detail: { id: branch.id }
          }));
        });

        branchEl.append(fromLabel, arrow1, condition, arrow2, toLabel, removeBtn);
        branchContainer.appendChild(branchEl);
      });
    } else {
      const empty = el('div', 'logic-branches__empty', 'No branching logic defined.');
      branchContainer.appendChild(empty);
    }

    container.appendChild(branchContainer);

    // ── Add branch button ──
    const addBtn = el('button', 'cyber-btn cyber-btn--primary add-logic-btn', '+ Add Logic Branch');
    addBtn.addEventListener('click', () => {
      this.playSound('click');
      this.eventBus.dispatchEvent(new CustomEvent('logic:branch-add'));
    });
    container.appendChild(addBtn);
  }

  // ═══════════════════════════════════════════
  // 4. RESPONDENT MODE
  // ═══════════════════════════════════════════

  /**
   * Show the immersive respondent (form-filling) overlay.
   *
   * @param {HTMLElement} container - parent element to inject overlay into
   * @param {Object[]} questions - array of question data
   * @param {Object[]} branches - logic branches (for future skip logic)
   */
  showRespondentMode(container, questions, branches) {
    // Remove any existing overlay first
    this.hideRespondentMode(container);

    const overlay = el('div');
    overlay.id = 'respondent-overlay';

    const respondentContainer = el('div', 'respondent-container');

    // ── Header ──
    const header = el('div', 'respondent-header');
    const title = el('h1', 'respondent-title', 'NexusFlow Survey');
    const desc  = el('p', 'respondent-desc', 'Complete the form below to submit your response.');
    header.append(title, desc);
    respondentContainer.appendChild(header);

    // ── Progress bar ──
    const progressWrap = el('div', 'respondent-progress');
    const tube = el('div', 'progress-tube');
    const tubeFill = el('div', 'progress-tube__fill');
    tubeFill.style.width = '0%';
    tube.appendChild(tubeFill);
    const progressText = el('span', 'respondent-progress__text', `0 / ${questions.length}`);
    progressWrap.append(tube, progressText);
    respondentContainer.appendChild(progressWrap);

    // ── Questions ──
    const questionsWrap = el('div', 'respondent-questions');

    /** Track which questions have been answered for progress */
    const answered = new Set();

    questions.forEach((q, i) => {
      const meta = TYPE_MAP[q.type] || QUESTION_TYPES[0];

      const card = el('div', 'respondent-question');
      card.dataset.id = q.id;

      const num = el('div', 'respondent-question__number', pad2(i + 1));
      const qTitle = el('h2', 'respondent-question__title');
      qTitle.textContent = q.title || `Question ${i + 1}`;
      if (q.required) {
        const reqMark = el('span', 'respondent-question__required', ' *');
        qTitle.appendChild(reqMark);
      }
      const qDesc = el('p', 'respondent-question__desc', q.description || '');
      if (!q.description) qDesc.style.display = 'none';

      const inputWrap = el('div', 'respondent-question__input');
      this._renderTypeContent(inputWrap, q, true);

      card.append(num, qTitle, qDesc, inputWrap);
      questionsWrap.appendChild(card);
    });

    respondentContainer.appendChild(questionsWrap);

    // ── Progress updater ──
    const updateProgress = () => {
      const pct = questions.length ? (answered.size / questions.length) * 100 : 0;
      tubeFill.style.width = `${pct}%`;
      progressText.textContent = `${answered.size} / ${questions.length}`;
    };

    // Listen for respondent input events to update progress
    const onInput = (e) => {
      const { id, value } = e.detail;
      const isEmpty = value === '' || value === null || value === undefined ||
                      (Array.isArray(value) && value.length === 0);
      if (isEmpty) {
        answered.delete(id);
      } else {
        answered.add(id);
      }
      updateProgress();
    };
    this.eventBus.addEventListener('respondent:input', onInput);

    // ── Actions ──
    const actions = el('div', 'respondent-actions');
    const submitBtn = el('button', 'cyber-btn cyber-btn--primary respondent-submit-btn', 'SUBMIT');
    submitBtn.addEventListener('click', () => {
      // Validate required questions
      const unanswered = questions.filter(q => q.required && !answered.has(q.id));
      if (unanswered.length > 0) {
        this.playSound('error');
        this.showToast(`Please answer all required questions (${unanswered.length} remaining)`, 'error');
        // Highlight unanswered required questions
        unanswered.forEach(q => {
          const qCard = questionsWrap.querySelector(`[data-id="${q.id}"]`);
          if (qCard) {
            qCard.classList.add('respondent-question--error');
            setTimeout(() => qCard.classList.remove('respondent-question--error'), 2000);
          }
        });
        return;
      }
      this.playSound('success');
      this.showToast('Response submitted successfully!', 'success');
      this.eventBus.dispatchEvent(new CustomEvent('respondent:submitted'));
      setTimeout(() => this.hideRespondentMode(container), 1200);
    });
    actions.appendChild(submitBtn);
    respondentContainer.appendChild(actions);

    // ── Close button ──
    const closeBtn = el('button', 'respondent-close cyber-btn cyber-btn--icon', '✕');
    closeBtn.addEventListener('click', () => {
      this.playSound('click');
      this.hideRespondentMode(container);
    });
    respondentContainer.appendChild(closeBtn);

    // ── Store cleanup reference ──
    overlay._cleanup = () => {
      this.eventBus.removeEventListener('respondent:input', onInput);
    };

    overlay.appendChild(respondentContainer);

    // Animate entrance
    requestAnimationFrame(() => {
      container.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('respondent-overlay--visible'));
    });

    this.playSound('success');
  }

  /**
   * Hide and clean up the respondent overlay.
   * @param {HTMLElement} container
   */
  hideRespondentMode(container) {
    const overlay = container.querySelector('#respondent-overlay') ||
                    document.getElementById('respondent-overlay');
    if (!overlay) return;

    overlay.classList.remove('respondent-overlay--visible');
    overlay.classList.add('respondent-overlay--exiting');

    if (typeof overlay._cleanup === 'function') {
      overlay._cleanup();
    }

    setTimeout(() => overlay.remove(), 500);
  }

  // ═══════════════════════════════════════════
  // 5. AUDIO
  // ═══════════════════════════════════════════

  /**
   * Play a UI sound effect.
   * @param {'click'|'drop'|'error'|'success'|'hover'} type
   */
  playSound(type) {
    this.audio.play(type);
  }

  // ═══════════════════════════════════════════
  // 6. TOAST NOTIFICATIONS
  // ═══════════════════════════════════════════

  /**
   * Display a toast notification that auto-dismisses.
   * @param {string} message
   * @param {'info'|'success'|'error'} [type='info']
   */
  showToast(message, type = 'info') {
    const toast = el('div', `nexus-toast nexus-toast--${type}`);

    const icon = el('span', 'nexus-toast__icon', TOAST_ICONS[type] || TOAST_ICONS.info);
    const msg  = el('span', 'nexus-toast__message', message);

    toast.append(icon, msg);

    // Insert into toast container (create if needed)
    let toastContainer = document.querySelector('.nexus-toast-container');
    if (!toastContainer) {
      toastContainer = el('div', 'nexus-toast-container');
      document.body.appendChild(toastContainer);
    }

    toastContainer.appendChild(toast);

    // Trigger enter animation
    requestAnimationFrame(() => toast.classList.add('nexus-toast--enter'));

    // Auto-dismiss
    setTimeout(() => {
      toast.classList.remove('nexus-toast--enter');
      toast.classList.add('nexus-toast--exit');
    }, 3000);

    setTimeout(() => {
      toast.remove();
      // Clean up empty container
      if (toastContainer && toastContainer.children.length === 0) {
        toastContainer.remove();
      }
    }, 3500);
  }
}

 * ═══════════════════════════════════════════════════════════════════
 *  NexusFlow — Sovereign Form Architect
 *  Main Application Orchestrator (app.js)

 *
 *  This is the MAIN entry point loaded as type="module" from index.html.

 *    • Initialize CanvasEngine and NexusFlowUI
 *    • Own and mutate all application state
