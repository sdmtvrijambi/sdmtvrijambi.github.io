<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengisian Gangguan SIMPEG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --base-canvas: #09090b;
            --surface-glass: rgba(15, 15, 20, 0.7);
            --border-glass: rgba(212, 175, 55, 0.2);
            --border-glass-active: rgba(212, 175, 55, 0.6);
            --glass-blur: blur(14px) saturate(120%);
            --fire-glow: #e25822;
            --gold-accent: #d4af37;
        }

        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        body {
            background: var(--base-canvas);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #e4e4e7;
        }

        /* ===== GOT FIRE ANIMATIONS ===== */
        @keyframes floatMedallion {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes firePulse {
            0% { box-shadow: 0 0 30px rgba(226, 88, 34, 0.2); }
            50% { box-shadow: 0 0 60px rgba(226, 88, 34, 0.5), 0 0 80px rgba(212, 175, 55, 0.2); }
            100% { box-shadow: 0 0 30px rgba(226, 88, 34, 0.2); }
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Logo */
        .medallion-hero {
            animation: floatMedallion 4s ease-in-out infinite;
            perspective: 800px;
        }

        .medallion-hero .logo-wrapper {
            border-radius: 50% !important;
            transition: transform 0.3s ease;
            box-shadow: 0 0 40px rgba(226, 88, 34, 0.4), 0 0 10px rgba(212, 175, 55, 0.2) !important;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Cyber/Medieval Panel */
        .cyber-panel {
            background: var(--surface-glass);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass-active);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .cyber-panel::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.1rem;
            padding: 2px;
            background: linear-gradient(135deg, #e25822, #d4af37, #8b0000, #e25822);
            background-size: 400% 400%;
            animation: borderFlow 8s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .neon-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fcd34d;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .neon-input:focus {
            box-shadow: 0 0 0 2px rgba(226, 88, 34, 0.3), 0 4px 20px rgba(226, 88, 34, 0.2);
            border-color: #e25822;
            background: rgba(20, 10, 10, 0.8);
            outline: none;
        }

        .neon-input::placeholder { color: #71717a; }

        #got-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .hidden { display: none; }

        /* Premium browse button */
        .browse-btn {
            background: linear-gradient(135deg, #8b0000 0%, #e25822 100%);
            color: #fef3c7;
            border: 1px solid #d4af37;
            position: relative;
            overflow: hidden;
        }
        .browse-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }
        .browse-btn:hover::after { opacity: 1; left: 100%; }
        .browse-btn:hover { box-shadow: 0 8px 25px rgba(226, 88, 34, 0.4); }

        .form-label {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <!-- Embers Background Canvas -->
    <canvas id="got-canvas"></canvas>

    <div class="max-w-2xl mx-auto w-full my-6 p-4 flex-grow flex flex-col justify-center relative z-10 min-h-screen">
        
        <!-- HEADER SECTION -->
        <div class="flex flex-col items-center mb-8 relative">
            
            <!-- Speech Bubble -->
            <div class="bg-black/60 backdrop-blur-lg border border-red-900/80 text-amber-100 px-6 py-3 rounded-2xl text-xs font-cinzel mb-5 shadow-[0_4px_20px_rgba(226,88,34,0.3)] max-w-sm text-center relative">
                <div class="flex items-center justify-center space-x-2 mb-1.5">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    <span class="text-[10px] text-amber-500 font-cinzel tracking-[0.2em] uppercase font-bold">Sebutkan
                </div>
                <p id="robot-bubble" class="transition-all duration-300 text-amber-50 text-sm font-semibold">Isi data dengan lengkap jangan di singkat!</p>
                <div class="absolute bottom-[-7px] left-1/2 transform -translate-x-1/2 w-3.5 h-3.5 bg-black/60 border-r border-b border-red-900 rotate-45"></div>
            </div>

            <!-- 3D Dragon Logo Container -->
            <div class="medallion-hero relative cursor-pointer" id="ball-container">
                <div class="logo-wrapper w-48 h-48 overflow-hidden flex items-center justify-center bg-transparent relative" style="border-radius: 50%; box-shadow: 0 0 30px rgba(226, 88, 34, 0.3);">
                    <div id="ball-logo" class="w-full h-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center"></div>
                </div>
            </div>
        </div>

        <!-- FORM CONTAINER -->
        <div class="cyber-panel p-6 sm:p-8 rounded-2xl relative overflow-hidden">
            <form id="cyber-form" class="space-y-6 relative z-10">
                <!-- Header Title -->
                <div class="text-center border-b border-red-900/60 pb-4">
                    <h2 class="text-3xl font-cinzel font-extrabold tracking-wider bg-gradient-to-r from-red-600 via-orange-500 to-yellow-500 bg-clip-text text-transparent">FORMULIR ABSENSI</h2>
                    <p class="text-xs text-amber-600/70 font-cinzel mt-1.5 tracking-[0.15em] uppercase">Khusus Gangguan Massal Simpeg</p>
                </div>

                <!-- Input: Nama -->
                <div>
                    <label class="block text-xs font-cinzel tracking-widest form-label mb-1.5 flex items-center space-x-1.5 font-bold">
                        <span class="text-red-500">🐉</span>
                        <span>NAMA LENGKAP</span>
                    </label>
                    <input type="text" name="Nama_Lengkap" id="input-nama" required 
                           onfocus="updateBubble('nama')" 
                           placeholder="Masukkan nama lengkap..."
                           class="neon-input w-full rounded-xl p-3.5 text-sm font-cinzel">
                </div>

                <!-- Input: NIP -->
                <div>
                    <label class="block text-xs font-cinzel tracking-widest form-label mb-1.5 flex items-center space-x-1.5 font-bold">
                        <span class="text-red-500">⚔️</span>
                        <span>NIP</span>
                    </label>
                    <input type="text" name="NIP" id="input-nip" required 
                           onfocus="updateBubble('nip')" 
                           placeholder="Masukkan NIP Anda..."
                           class="neon-input w-full rounded-xl p-3.5 text-sm font-cinzel">
                </div>

                <!-- Input: Status Operasional -->
                <div>
                    <label class="block text-xs font-cinzel tracking-widest form-label mb-1.5 flex items-center space-x-1.5 font-bold">
                        <span class="text-red-500">⚙️</span>
                        <span>STATUS OPERASIONAL</span>
                    </label>
                    <select name="Status_Operasional" id="input-status" required 
                            onfocus="updateBubble('status')" 
                            class="neon-input w-full rounded-xl p-3.5 text-sm font-cinzel cursor-pointer">
                        <option value="Operasional" style="background-color: #140a0a; color: #fcd34d;">Operasional</option>
                        <option value="Non Operasional" style="background-color: #140a0a; color: #fcd34d;">Non Operasional</option>
                    </select>
                </div>

                <!-- Upload Foto Geotag Datang -->
                <div>
                    <label class="block text-xs font-cinzel tracking-widest form-label mb-1.5 flex items-center space-x-1.5 font-bold">
                        <span class="text-red-500">🔥</span>
                        <span>UPLOAD FOTO GEOTAG DATANG</span>
                    </label>
                    <div class="relative w-full bg-black/40 border border-red-900/50 rounded-xl p-3 text-sm font-cinzel focus-within:ring-2 focus-within:ring-red-500/50 focus-within:border-orange-400 transition-all flex items-center backdrop-blur-sm">
                        <input type="file" id="input-file-datang" accept="image/*" required
                               onchange="handleFileChange('datang')" 
                               onfocus="updateBubble('file-datang')" class="hidden">
                        <label for="input-file-datang" class="browse-btn cursor-pointer px-4 py-2 rounded-lg text-xs font-cinzel font-bold mr-3 tracking-wider transition-all shadow-md">
                            📁 BROWSE
                        </label>
                        <span id="file-name-datang" class="text-xs text-zinc-400 truncate max-w-[220px]">Belum ada file dipilih...</span>
                    </div>
                </div>

                <!-- Upload Foto Geotag Pulang -->
                <div>
                    <label class="block text-xs font-cinzel tracking-widest form-label mb-1.5 flex items-center space-x-1.5 font-bold">
                        <span class="text-red-500">🔥</span>
                        <span>UPLOAD FOTO GEOTAG PULANG</span>
                    </label>
                    <div class="relative w-full bg-black/40 border border-red-900/50 rounded-xl p-3 text-sm font-cinzel focus-within:ring-2 focus-within:ring-red-500/50 focus-within:border-orange-400 transition-all flex items-center backdrop-blur-sm">
                        <input type="file" id="input-file-pulang" accept="image/*" 
                               onchange="handleFileChange('pulang')" 
                               onfocus="updateBubble('file-pulang')" class="hidden">
                        <label for="input-file-pulang" class="browse-btn cursor-pointer px-4 py-2 rounded-lg text-xs font-cinzel font-bold mr-3 tracking-wider transition-all shadow-md">
                            📁 BROWSE
                        </label>
                        <span id="file-name-pulang" class="text-xs text-zinc-400 truncate max-w-[220px]">Belum ada file dipilih...</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" id="btn-submit" 
                            class="w-full relative group overflow-hidden bg-gradient-to-r from-red-800 via-red-600 to-orange-700 hover:from-red-600 hover:via-orange-500 hover:to-yellow-600 text-amber-100 font-cinzel font-black tracking-widest py-4 px-6 rounded-xl shadow-[0_10px_30px_rgba(226,88,34,0.3)] hover:shadow-[0_15px_40px_rgba(226,88,34,0.5)] transition-all duration-300 transform active:scale-[0.97]">
                        <span class="relative z-10 flex items-center justify-center space-x-2 text-sm">
                            <span>🐉</span>
                            <span>KIRIM DATA</span>
                            <span>🔥</span>
                        </span>
                        <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-400"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-5 text-[11px] font-cinzel tracking-widest text-zinc-500 relative z-10 flex items-center justify-center space-x-3 pb-8">
        <span>Satria &copy; 2026</span>
        <span class="text-red-500">🐉</span>
        <span class="text-amber-600 font-bold">TVRI Stasiun Jambi</span>
    </footer>

    <script>
        // ==========================================
        // GOOGLE APPS SCRIPT WEB APP URL
        // ==========================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJFrxYez0vD_SuBwA3iNcgXqGHTOoJmSxHtk7doieKTTzzqFiVMhLvNJKx9PUj6aav/exec'; // GANTI INI NANTI

        // ==========================================
        // 1. SPEECH BUBBLE CONTROL
        // ==========================================
        const robotBubble = document.getElementById('robot-bubble');

        function updateBubble(field) {
            const messages = {
                'nama': "🐉 Sebutkan nama lengkap!",
                'nip': "⚔️ Berapa NIP?",
                'status': "⚙️ Pilih status operasional Anda!",
                'file-datang': "🔥 Unggah bukti kehadiran .",
                'file-pulang': "🔥 Unggah bukti kepulangan."
            };
            robotBubble.innerText = messages[field] || "Isi data dengan lengkap jangan di singkat!";
        }

        // ==========================================
        // 2. FILE UPLOAD HANDLING
        // ==========================================
        let fileDataDatang = { base64: '', name: '', type: '' };
        let fileDataPulang = { base64: '', name: '', type: '' };

        function handleFileChange(type) {
            const fileInput = document.getElementById(`input-file-${type}`);
            const fileNameSpan = document.getElementById(`file-name-${type}`);
            const fileData = type === 'datang' ? fileDataDatang : fileDataPulang;
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileNameSpan.innerText = file.name;
                fileNameSpan.className = "text-xs text-amber-500 font-bold font-cinzel truncate max-w-[220px]";
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    fileData.base64 = e.target.result.split(',')[1];
                    fileData.name = file.name;
                    fileData.type = file.type;
                    robotBubble.innerText = `🔥 Bukti ${type} siap dibakar ke dalam catatan!`;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameSpan.innerText = "Belum ada file dipilih...";
                fileNameSpan.className = "text-xs text-zinc-400 truncate max-w-[220px]";
                fileData.base64 = ''; fileData.name = ''; fileData.type = '';
            }
        }

        // ==========================================
        // 3. GAME OF THRONES EMBERS BACKGROUND
        // ==========================================
        const canvas = document.getElementById('got-canvas');
        const ctx = canvas.getContext('2d');
        let embers = [];

        class Ember {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.clientHeight; 
            }
            reset() {
                this.x = Math.random() * canvas.clientWidth;
                this.y = canvas.clientHeight + 10;
                this.size = Math.random() * 2.5 + 0.5;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = -(Math.random() * 2 + 1);
                this.life = Math.random() * 0.5 + 0.5;
                this.decay = Math.random() * 0.005 + 0.002;
                this.color = Math.random() > 0.5 ? '#ff4500' : '#ffa500';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                if (this.life <= 0 || this.y < -10) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color === '#ff4500' ? '255, 69, 0' : '255, 165, 0'}, ${this.life})`;
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            }
        }

        function initEmbers() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            embers = [];
            for (let i = 0; i < 150; i++) {
                embers.push(new Ember());
            }
        }

        window.addEventListener('resize', initEmbers);
        initEmbers();

        function renderEmbers() {
            // Draw dark gradient background
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#050505');
            gradient.addColorStop(1, '#2b0a0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            embers.forEach(ember => {
                ember.update();
                ember.draw();
            });
            requestAnimationFrame(renderEmbers);
        }
        renderEmbers();

        // ==========================================
        // 4. FORM SUBMISSION
        // ==========================================
        const form = document.getElementById('cyber-form');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (GOOGLE_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbyJFrxYez0vD_SuBwA3iNcgXqGHTOoJmSxHtk7doieKTTzzqFiVMhLvNJKx9PUj6aav/exec') {
                alert("Harap masukkan URL Google Apps Script Anda ke dalam variabel GOOGLE_SCRIPT_URL.");
                return;
            }

            robotBubble.innerText = "🐉 Naga sedang mengirim pesan... Mohon tunggu.";
            btnSubmit.innerHTML = `<span class="relative z-10 flex items-center justify-center space-x-2"><span class="animate-spin text-lg">🔥</span><span>MENGIRIM...</span></span>`;
            btnSubmit.disabled = true;

            const payload = {
                "Nama_Lengkap": document.getElementById('input-nama').value,
                "NIP": document.getElementById('input-nip').value,
                "Status_Operasional": document.getElementById('input-status').value,
                "File_Datang_Base64": fileDataDatang.base64,
                "File_Datang_Name": fileDataDatang.name,
                "File_Datang_Type": fileDataDatang.type,
                "File_Pulang_Base64": fileDataPulang.base64,
                "File_Pulang_Name": fileDataPulang.name,
                "File_Pulang_Type": fileDataPulang.type
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                robotBubble.innerText = "🏆 Data Telah Diterima SDM!";
                alert("Data & File Berhasil Terkirim ke Server SDM!");
                
                form.reset();
                document.getElementById('file-name-datang').innerText = "Belum ada file dipilih...";
                document.getElementById('file-name-datang').className = "text-xs text-zinc-400 truncate max-w-[220px]";
                document.getElementById('file-name-pulang').innerText = "Belum ada file dipilih...";
                document.getElementById('file-name-pulang').className = "text-xs text-zinc-400 truncate max-w-[220px]";
                fileDataDatang = { base64: '', name: '', type: '' };
                fileDataPulang = { base64: '', name: '', type: '' };
            } catch (error) {
                console.error(error);
                robotBubble.innerText = "❌ Gagal mengirim pesan. Gagak mati di jalan.";
                alert("Gagal Mengirim Data.");
            } finally {
                btnSubmit.innerHTML = `<span class="relative z-10 flex items-center justify-center space-x-2 text-sm"><span>🐉</span><span>KIRIM DATA</span><span>🔥</span></span>`;
                btnSubmit.disabled = false;
            }
        });

    </script>

    <!-- Three.js 3D Dragon Logo Implementation -->
    <script>
        const ballContainer = document.getElementById('ball-logo');
        if (ballContainer && typeof THREE !== 'undefined') {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, ballContainer.clientWidth / ballContainer.clientHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(ballContainer.clientWidth, ballContainer.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            ballContainer.appendChild(renderer.domElement);

            camera.position.z = 5.0;

            const coinGroup = new THREE.Group();
            scene.add(coinGroup);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffaa00, 1.2, 15);
            pointLight.position.set(-3, -3, 3);
            scene.add(pointLight);

            // Create 3D Cylinder/Medallion
            const geometry = new THREE.CylinderGeometry(1.6, 1.6, 0.18, 64);

            const emberCount = 50;
            const emberGeometry = new THREE.BufferGeometry();
            const emberPositions = new Float32Array(emberCount * 3);
            const emberVelocities = [];

            for (let i = 0; i < emberCount; i++) {
                emberPositions[i*3] = (Math.random() - 0.5) * 1.5;
                emberPositions[i*3+1] = -1.2;

                    coinMesh.rotation.y += 0.015;

                            ePositions[i*3] = (Math.random() - 0.5) * 1.2;
                            ePositions[i*3+1] = -1.0;
                            ePositions[i*3+2] = (Math.random() - 0.5) * 0.3;
                            ev.life = 1.0;
                        }
                        
                        ePositions[i*3] += ev.x;
                        ePositions[i*3+1] += ev.y;
                        ePositions[i*3+2] += ev.z;
                    }
                    emberGeometry.attributes.position.needsUpdate = true;
                }

                renderer.render(scene, camera);
            }
            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                if (ballContainer.clientWidth > 0) {
                    camera.aspect = ballContainer.clientWidth / ballContainer.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(ballContainer.clientWidth, ballContainer.clientHeight);
                }
            });
        }
    </script>
</body>
</html>
