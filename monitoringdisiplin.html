/* Animated Running & Chasing Cats in Background */
.running-cats-container {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100vw;
    height: 50px;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.cat-runner {
    position: absolute;
    bottom: 0;
    font-size: 2rem;
    filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.15));
}

.cat-chased {
    color: var(--accent-color);
    animation: chaseRunning 12s linear infinite;
}

.cat-chaser {
    color: var(--primary-blue);
    animation: chaseRunning 12s linear infinite;
    animation-delay: -0.5s;
}

@keyframes chaseRunning {
    0% {
        left: -60px;
        transform: translateY(0) rotate(0deg);
    }
    20% {
        transform: translateY(-8px) rotate(-5deg);
    }
    40% {
        transform: translateY(0) rotate(0deg);
    }
    60% {
        transform: translateY(-8px) rotate(5deg);
    }
    80% {
        transform: translateY(0) rotate(0deg);
    }
    100% {
        left: 100vw;
        transform: translateY(0) rotate(0deg);
    }
}

/* Layout - Compact Enterprise Scale */
.container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    position: relative;
    z-index: 1;
}

/* Glassmorphism Utilities */
.glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
}

/* Redesigned Compact Header */
.glass-header {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.85));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 18px;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.25rem;
    box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.04);
}

.header-branding {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.brand-logo {
    width: 44px;
    height: 44px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: var(--primary-blue);
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.08);
}

.brand-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 0.65rem;
    letter-spacing: -0.01em;
}

.highlight {
    background: linear-gradient(135deg, var(--primary-blue), var(--accent-color));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.status-badge {
    font-size: 0.7rem;
    font-weight: 600;
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}

.status-badge .dot {
    width: 6px;
    height: 6px;
    background-color: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}

.brand-sub {
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 500;
    margin-top: 0.1rem;
}

/* Header Action Group (Right Side) */
.header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.search-container {
    position: relative;
    width: 260px;
}

.search-icon {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1rem;
}

#searchInput {
    width: 100%;
    padding: 0.55rem 2.2rem 0.55rem 2.4rem;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    transition: all 0.2s ease;
}

#searchInput:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

#searchInput::placeholder {
    color: #94a3b8;
}

.search-shortcut {
    position: absolute;
    right: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    font-weight: 600;
    background: #f1f5f9;
    color: #64748b;
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
}

.action-btn {
    height: 36px;
    padding: 0 0.85rem;
    background: white;
    color: var(--text-main);
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.action-btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: var(--primary-blue);
}

.link-btn {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: var(--primary-blue);
}

.link-btn:hover {
    background: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
}

/* Compact Stats Row */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
}

.stat-card {
    padding: 1.1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #f1f5f9;
}

.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -10px rgba(37, 99, 235, 0.1);
}

.stat-icon-wrapper {
    width: 44px;
    height: 44px;
    background: #eff6ff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--primary-blue);
    flex-shrink: 0;
}

.stat-info {
    display: flex;
    flex-direction: column;
}

.stat-value {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.2;
}

.stat-label {
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Compact Table */
.table-container {
    padding: 1rem;
    background: rgba(255, 255, 255, 0.95);
}

.table-scroll {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

th {
    text-align: left;
    padding: 0.75rem 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #f1f5f9;
    text-transform: uppercase;
}

td {
    padding: 0.75rem 0.85rem;
    background: transparent;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.15s ease;
    color: var(--text-main);
    font-size: 0.85rem;
}

tbody tr:hover td {
    background: rgba(239, 246, 255, 0.6);
}

tbody tr:last-child td {
    border-bottom: none;
}

.tag {
    background: #f1f5f9;
    color: #475569;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: monospace;
    border: 1px solid #e2e8f0;
}

.btn-detail {
    background: white;
    color: var(--primary-blue);
    border: 1px solid #e2e8f0;
    padding: 0.35rem 0.65rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.btn-detail:hover {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.spinner {
    animation: spin 1s linear infinite;
    display: inline-block;
}

.spinning {
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.loading-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    padding: 2.5rem !important;
}

/* Compact Modal */
.modal-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 0.25s ease;
}

.modal-backdrop.hidden {
    opacity: 0;
    pointer-events: none;
}

.modal-content {
    width: 90%;
    max-width: 520px;
    max-height: 85vh;
    background: white;
    border-radius: 20px;
    overflow-y: auto;
    transform: translateY(0);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
    border: 1px solid #e2e8f0;
}

.modal-backdrop.hidden .modal-content {
    transform: translateY(20px) scale(0.96);
}

.modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8fafc;
    position: sticky;
    top: 0;
    z-index: 10;
}

.modal-header h2 {
    font-size: 1.15rem;
    color: var(--text-main);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.modal-header h2 i {
    color: var(--primary-blue);
}

.close-btn {
    background: #f1f5f9;
    border: none;
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
}

.close-btn:hover {
    background: #fee2e2;
    color: #ef4444;
}

.modal-body {
    padding: 1.5rem;
}

.detail-grid {
    display: grid;
    gap: 0.75rem;
}

.detail-item {
    background: #f8fafc;
    padding: 0.85rem 1.1rem;
    border-radius: 12px;
    border: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.detail-label {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.85rem;
}

.detail-value {
    font-weight: 700;
    color: var(--primary-blue);
    font-size: 0.95rem;
}

.modal-user-info {
    margin-bottom: 1.25rem;
    text-align: center;
}

.modal-user-info h3 {
    color: var(--text-main);
    font-size: 1.35rem;
    font-weight: 800;
    margin-bottom: 0.25rem;
}

.modal-user-info p {
    color: var(--text-muted);
    background: #f1f5f9;
    display: inline-block;
    padding: 0.2rem 0.75rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: monospace;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: #f1f5f9;
}
::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

    </style>
</head>
<body>
    <div class="background-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    
    <!-- Animated Running & Chasing Cats Background Overlay -->
    <div class="running-cats-container">
        <div class="cat-runner cat-chased" title="Kucing Depan"><i class="ph-fill ph-cat"></i></div>
        <div class="cat-runner cat-chaser" title="Kucing Mengejar"><i class="ph-fill ph-cat"></i></div>
    </div>

    <main class="container">
        <header class="glass-header">
            <div class="header-branding">
                <div class="brand-logo">
                    <i class="ph-fill ph-cat"></i>
                </div>
                <div class="brand-text">
                    <div class="brand-title">
                        Monitoring Pengisian Disiplin <span class="highlight">TVRI Jambi</span>
                        <span class="status-badge" title="Live Synced with Google Sheets">
                            <span class="dot"></span> Live Sync
                        </span>
                    </div>
                    <p class="brand-sub">Dashboard Pemantauan Disiplin Pegawai</p>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="search-container">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama pegawai...">
                    <span class="search-shortcut">Ctrl K</span>
                </div>
                
                <button id="refreshBtn" class="action-btn" title="Refresh Data Satelit">
                    <i class="ph ph-arrows-clockwise"></i>
                </button>

                <a href="https://sdmtvrijambi.github.io/disiplin" target="_blank" rel="noopener" class="action-btn link-btn" title="Buka Form Penilaian">
                    <i class="ph ph-arrow-square-out"></i> Form Disiplin
                </a>
            </div>
        </header>

        <section class="stats-row">
            <div class="stat-card glass-panel">
                <div class="stat-icon-wrapper">
                    <i class="ph-fill ph-users"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalRespondents">0</span>
                    <span class="stat-label">Total Pegawai</span>
                </div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-icon-wrapper">
                    <i class="ph-fill ph-chart-line-up"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="averageScore">0.00</span>
                    <span class="stat-label">Skor Rata-Rata</span>
                </div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-icon-wrapper">
                    <i class="ph-fill ph-clock-counter-clockwise"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="lastUpdated">-</span>
                    <span class="stat-label">Terakhir Diperbarui</span>
                </div>
            </div>
        </section>

        <section class="table-container glass-panel">
            <div class="table-scroll">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th width="60">No</th>
                            <th>Nama Pegawai</th>
                            <th>NIP</th>
                            <th>Total Nilai</th>
                            <th>Predikat</th>
                            <th>Waktu Pengisian</th>
                            <th width="90">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" class="loading-state">
                                <i class="ph ph-spinner-gap spinner"></i> Menarik data dari server...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Modal for Detail -->
        <div id="detailModal" class="modal-backdrop hidden">
            <div class="modal-content glass-panel">
                <div class="modal-header">
                    <h2><i class="ph-fill ph-paw-print"></i> Rincian Nilai Pegawai</h2>
                    <button id="closeModal" class="close-btn"><i class="ph ph-x"></i></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Detail content will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
const PRIMARY_CSV_URL = 'https://docs.google.com/spreadsheets/d/1EW8AD28NsGbJD7ycpQUxHzG0P8nOHPbFNgKDmXKFkiM/export?format=csv';
const SECONDARY_CSV_URL = 'https://docs.google.com/spreadsheets/d/1EW8AD28NsGbJD7ycpQUxHzG0P8nOHPbFNgKDmXKFkiM/gviz/tq?tqx=out:csv';
const PROXY_CSV_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(PRIMARY_CSV_URL);

let globalData = [];

document.addEventListener('DOMContentLoaded', () => {
    fetchData();

    const searchInput = document.getElementById('searchInput');

    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            // Index 1 is Nama. Filter solely by Nama based on user request "pencarian nama pegawai saja"
            const filteredData = globalData.filter(row => row[1] && row[1].toLowerCase().includes(searchTerm));
            renderTable(filteredData);
        });
    }

    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
            const icon = refreshBtn.querySelector('i');
            if (icon) icon.classList.add('spinning');
            fetchData(() => {
                if (icon) icon.classList.remove('spinning');
            });
        });
    }

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (searchInput) searchInput.focus();
        }
    });

    const closeModal = document.getElementById('closeModal');
    if (closeModal) {
        closeModal.addEventListener('click', () => {
            document.getElementById('detailModal').classList.add('hidden');
        });
    }

    const detailModal = document.getElementById('detailModal');
    if (detailModal) {
        detailModal.addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                e.target.classList.add('hidden');
            }
        });
    }
});

async function fetchWithTimeout(resource, options = {}) {
    const { timeout = 5000 } = options;
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(resource, {
            ...options,
            signal: controller.signal
        });
        clearTimeout(id);
        return response;
    } catch (error) {
        clearTimeout(id);
        throw error;
    }
}

async function fetchData(callback) {
    const tbody = document.getElementById('tableBody');
    if (tbody) {
        tbody.innerHTML = `<tr><td colspan="7" class="loading-state"><i class="ph ph-spinner-gap spinner"></i> Menarik data dari server...</td></tr>`;
    }

    let csvText = null;

    // Attempt 1: Direct Export URL
    try {
        const res = await fetchWithTimeout(PRIMARY_CSV_URL, { timeout: 4000 });
        if (res.ok) {
            csvText = await res.text();
        }
    } catch (e1) {
        console.warn("Attempt 1 (Direct Export) failed:", e1);
    }

    // Attempt 2: Secondary GViz Endpoint
    if (!csvText) {
        try {
            const res = await fetchWithTimeout(SECONDARY_CSV_URL, { timeout: 4000 });
            if (res.ok) {
                csvText = await res.text();
            }
        } catch (e2) {
            console.warn("Attempt 2 (GViz Endpoint) failed:", e2);
        }
    }

    // Attempt 3: AllOrigins CORS Proxy (For file:// protocol CORS bypass)
    if (!csvText) {
        try {
            const res = await fetchWithTimeout(PROXY_CSV_URL, { timeout: 6000 });
            if (res.ok) {
                csvText = await res.text();
            }
        } catch (e3) {
            console.warn("Attempt 3 (CORS Proxy) failed:", e3);
        }
    }

    if (csvText) {
        parseCSVText(csvText);
    } else {
        renderErrorState();
    }

    if (callback) callback();
}

function parseCSVText(csvText) {
    let parsedData = [];
    if (window.Papa) {
        const results = Papa.parse(csvText, { header: false, skipEmptyLines: true });
        parsedData = results.data;
    } else {
        // Simple fallback parser if PapaParse CDN is blocked
        parsedData = csvText.split('\n').map(line => line.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
    }

    if (parsedData && parsedData.length > 2) {
        const dataRows = parsedData.slice(2);
        globalData = dataRows;
        updateStats(dataRows);
        renderTable(dataRows);
    } else {
        const tbody = document.getElementById('tableBody');
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="loading-state">Data tidak ditemukan.</td></tr>`;
    }
}

function renderErrorState() {
    const tbody = document.getElementById('tableBody');
    if (tbody) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="loading-state" style="color: #ef4444; padding: 2.5rem !important;">
                    <i class="ph ph-warning-circle" style="font-size: 2rem; margin-bottom: 0.5rem; display: inline-block;"></i><br>
                    <strong>Gagal Menghubungkan ke Google Sheets</strong><br>
                    <span style="font-size: 0.85rem; color: #64748b; display: block; margin: 0.5rem 0 1rem 0;">
                        Koneksi terhambat atau diblokir oleh kebijakan keamanan browser (CORS / Local File Protocol).
                    </span>
                    <button onclick="fetchData()" class="btn-detail" style="background: #ef4444; color: white; border: none; padding: 0.5rem 1.25rem;">
                        <i class="ph ph-arrows-clockwise"></i> Coba Lagi
                    </button>
                </td>
            </tr>
        `;
    }
}

function updateStats(data) {
    const totalEl = document.getElementById('totalRespondents');
    if (totalEl) totalEl.textContent = data.length;
    
    let totalAll = 0;
    let count = 0;
    
    data.forEach(row => {
        const totalNilai = parseFloat(row[15]);
        if(!isNaN(totalNilai)) {
            totalAll += totalNilai;
            count++;
        }
    });
    
    const avg = count > 0 ? (totalAll / count).toFixed(2) : '0.00';
    const avgEl = document.getElementById('averageScore');
    if (avgEl) avgEl.textContent = avg;

    let latestTime = "-";
    if(data.length > 0) {
        const lastRow = data[data.length - 1];
        if(lastRow && lastRow[17]) {
            try {
                latestTime = new Date(lastRow[17]).toLocaleString('id-ID', {
                    dateStyle: 'medium', timeStyle: 'short'
                });
            } catch (e) {
                latestTime = lastRow[17];
            }
        }
    }
    const lastUpdatedEl = document.getElementById('lastUpdated');
    if (lastUpdatedEl) lastUpdatedEl.textContent = latestTime;
}

function formatFloatValue(val) {
    if (!val) return '-';
    const num = parseFloat(val);
    if (!isNaN(num) && num % 1 !== 0) {
        return num.toFixed(2);
    }
    return val;
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="loading-state">Tidak ada data pegawai yang cocok dengan pencarian.</td></tr>`;
        return;
    }

    data.forEach((row, index) => {
        const no = row[0] || (index + 1);
        const nama = row[1] || '-';
        const nip = row[2] || '-';
        const totalNilai = formatFloatValue(row[15]);
        const predikat = formatFloatValue(row[16]);
        const waktuRaw = row[17];
        let waktu = waktuRaw || '-';
        
        try {
            if(waktuRaw) {
                waktu = new Date(waktuRaw).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
            }
        } catch(e) {}

        const tr = document.createElement('tr');
        const globalIndex = globalData.findIndex(r => r === row);

        tr.innerHTML = \`
            <td>\${no}</td>
            <td style="font-weight: 600; color: var(--text-main);">\${nama}</td>
            <td><span class="tag">\${nip}</span></td>
            <td><span style="color: var(--primary-blue); font-weight: bold;">\${totalNilai}</span></td>
            <td>\${predikat}</td>
            <td style="color: var(--text-muted); font-size: 0.8rem;">\${waktu}</td>
            <td>
                <button class="btn-detail" onclick="showDetail(\${globalIndex})">
                    <i class="ph ph-file-text"></i> Detail
                </button>
            </td>
        \`;
        tbody.appendChild(tr);
    });
}

function showDetail(index) {
    const row = globalData[index];
    if(!row) return;

    const modalBody = document.getElementById('modalBody');
    if (!modalBody) return;
    
    const nama = row[1] || '-';
    const nip = row[2] || '-';
    
    const details = [
        { label: "Kepatuhan Jam Kerja", nilai: row[3], bobot: row[4] },
        { label: "Kepatuhan Perintah", nilai: row[5], bobot: row[6] },
        { label: "Kepatuhan Tata Tertib", nilai: row[7], bobot: row[8] },
        { label: "Tanggung Jawab Tugas", nilai: row[9], bobot: row[10] },
        { label: "Kepatuhan Larangan", nilai: row[11], bobot: row[12] },
        { label: "Etika & Keteladanan", nilai: row[13], bobot: row[14] }
    ];

    let gridHtml = '';
    details.forEach(item => {
        gridHtml += \`
            <div class="detail-item">
                <span class="detail-label">\${item.label}</span>
                <span class="detail-value">Skor: \${item.nilai || '-'} (Bobot: \${formatFloatValue(item.bobot)})</span>
            </div>
        \`;
    });

    modalBody.innerHTML = \`
        <div class="modal-user-info">
            <h3>\${nama}</h3>
            <p>NIP: \${nip}</p>
        </div>
        <div class="detail-grid">
            \${gridHtml}
            <div class="detail-item" style="border-color: #bfdbfe; background: #eff6ff;">
                <span class="detail-label" style="color: var(--primary-blue); font-weight: bold;">TOTAL NILAI</span>
                <span class="detail-value" style="font-size: 1.2rem; color: var(--primary-blue);">\${formatFloatValue(row[15])}</span>
            </div>
            <div class="detail-item" style="border-color: #bfdbfe; background: #eff6ff;">
                <span class="detail-label" style="color: var(--primary-blue); font-weight: bold;">RATA-RATA / PREDIKAT</span>
                <span class="detail-value" style="font-size: 1.2rem; color: var(--primary-blue);">\${formatFloatValue(row[16])}</span>
            </div>
        </div>
    \`;

    const detailModal = document.getElementById('detailModal');
    if (detailModal) detailModal.classList.remove('hidden');
}

    </script>
