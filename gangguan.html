<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090807">
  <meta name="description" content="Formulir absensi khusus gangguan massal SIMPEG TVRI Stasiun Jambi.">
  <title>Formulir Gangguan SIMPEG — TVRI Stasiun Jambi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #070706;
      --stone: #12110f;
      --stone-2: #1c1915;
      --gold-pale: #ffe0a1;
      --gold: #d89c39;
      --gold-deep: #6d3a0a;
      --ember: #f24916;
      --blood: #7f160d;
      --cream: #f5ead1;
      --muted: #9e9588;
      --cut: polygon(0 18px, 18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px));
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      background:
        radial-gradient(circle at 50% 17%, rgba(118, 49, 10, .2), transparent 27rem),
        radial-gradient(circle at 12% 54%, rgba(133, 22, 8, .12), transparent 24rem),
        radial-gradient(circle at 88% 54%, rgba(133, 22, 8, .12), transparent 24rem),
        linear-gradient(180deg, #0b0b0a 0%, #080706 48%, #120705 100%);
      font-family: Manrope, system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      opacity: .48;
      background-image:
        repeating-linear-gradient(118deg, transparent 0 31px, rgba(255,255,255,.018) 32px, transparent 33px 62px),
        repeating-linear-gradient(27deg, transparent 0 46px, rgba(255,121,32,.018) 47px, transparent 48px 86px);
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      box-shadow: inset 0 0 13vw rgba(0,0,0,.92);
    }

    button, input, select { font: inherit; }

    .embers {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .world {
      position: relative;
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 28px;
      isolation: isolate;
    }

    .world::before,
    .world::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      opacity: .68;
      background: linear-gradient(90deg, #1c0c03, #b66a1a 42%, #311406 60%, transparent);
      box-shadow: 0 0 22px rgba(236, 91, 14, .35);
    }

    .world::before { left: 5px; }
    .world::after { right: 5px; transform: scaleX(-1); }

    .gate-lines {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(104deg, transparent 20%, rgba(226,130,37,.11) 20.15%, transparent 20.3%),
        linear-gradient(76deg, transparent 80%, rgba(226,130,37,.11) 80.15%, transparent 80.3%);
    }

    .decree {
      position: relative;
      z-index: 4;
      width: min(100%, 570px);
      margin: 0 auto 16px;
      padding: 17px 54px 19px;
      text-align: center;
      clip-path: var(--cut);
      background:
        linear-gradient(#0e0d0b, #0e0d0b) padding-box,
        linear-gradient(135deg, #4f2907, #ffbd53 26%, #5c2e05 50%, #f1a53a 72%, #3c1b03) border-box;
      border: 2px solid transparent;
      box-shadow: 0 18px 45px rgba(0,0,0,.55), inset 0 0 28px rgba(0,0,0,.8);
    }

    .decree::before {
      content: "";
      position: absolute;
      inset: 7px;
      clip-path: var(--cut);
      border: 1px solid rgba(255,191,82,.25);
      pointer-events: none;
    }

    .decree-kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 5px;
      color: var(--gold);
      font: 700 .74rem/1 Cinzel, serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .decree-kicker::before,
    .decree-kicker::after {
      content: "";
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .decree-kicker::after { transform: scaleX(-1); }

    .ruby {
      display: inline-block;
      width: 10px;
      height: 10px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #ff5633, #780700);
      border: 1px solid #f5a342;
      box-shadow: 0 0 12px #ed3b17;
    }

    .decree p {
      margin: 0;
      color: #f4ead8;
      font: 600 clamp(.88rem, 2.7vw, 1.08rem)/1.45 Cinzel, serif;
      letter-spacing: .025em;
      text-wrap: balance;
    }

    .hero {
      position: relative;
      z-index: 3;
      min-height: 400px;
      display: grid;
      place-items: center;
      margin-bottom: -28px;
      perspective: 1000px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: min(74vw, 540px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(247,102,19,.22), rgba(117,35,6,.08) 40%, transparent 68%);
      filter: blur(10px);
      animation: breathe 3.5s ease-in-out infinite;
    }

    .emblem-stage {
      position: relative;
      z-index: 3;
      width: 300px;
      height: 300px;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
    }

    .emblem-ring {
      position: absolute;
      inset: 17px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, #181713 0 50%, transparent 51%),
        conic-gradient(from 18deg, #3d1b03, #e4a13a, #3a1802, #ffd67c, #5c2e05, #d4932d, #3d1b03);
      border: 2px solid #e5ae52;
      box-shadow:
        0 34px 45px rgba(0,0,0,.78),
        0 0 35px rgba(244,92,15,.35),
        inset 0 0 0 9px #19140d,
        inset 0 0 0 11px rgba(255,201,101,.45),
        inset 0 0 34px #000;
      transform: translateZ(-24px);
    }

    .emblem-ring::before,
    .emblem-ring::after {
      content: "✦";
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      color: #bc7925;
      font-size: 17px;
      text-shadow: 0 0 10px #c7320b;
    }

    .emblem-ring::before { left: 13px; }
    .emblem-ring::after { right: 13px; }

    .emblem-core {
      position: relative;
      z-index: 2;
      width: 224px;
      height: 258px;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transition: transform .16s ease-out;
      filter: drop-shadow(0 17px 15px rgba(0,0,0,.72)) drop-shadow(0 0 7px rgba(235,146,47,.45));
      animation: hover 4s ease-in-out infinite;
    }

    .emblem-core img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sigil-caption {
      position: absolute;
      bottom: 15px;
      z-index: 5;
      color: #d49b48;
      font: 700 .62rem/1 Cinzel, serif;
      letter-spacing: .26em;
      text-transform: uppercase;
      text-shadow: 0 2px 2px #000;
    }

    .guardian {
      position: absolute;
      z-index: 1;
      top: 0;
      width: 174px;
      height: 426px;
      opacity: .96;
      pointer-events: none;
    }

    .guardian.left { left: 34px; transform: scaleX(-1); }
    .guardian.right { right: 34px; }

    .guardian-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      mix-blend-mode: screen;
      filter: contrast(1.08) saturate(.92) drop-shadow(0 22px 22px rgba(0,0,0,.88));
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    }

    .citadel {
      position: relative;
      z-index: 6;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 20px;
      clip-path: var(--cut);
      background:
        linear-gradient(145deg, rgba(32,29,25,.98), rgba(8,8,7,.99)) padding-box,
        linear-gradient(135deg, #3a2109, #f0ab43 13%, #4e2706 28%, #e4a346 52%, #4d2305 75%, #f0ae48 89%, #2f1705) border-box;
      border: 3px solid transparent;
      box-shadow: 0 35px 80px rgba(0,0,0,.75), 0 0 45px rgba(154,43,8,.2), inset 0 0 50px rgba(0,0,0,.8);
    }

    .citadel::before,
    .citadel::after {
      content: "";
      position: absolute;
      pointer-events: none;
      clip-path: var(--cut);
    }

    .citadel::before {
      inset: 7px;
      border: 1px solid rgba(242,173,75,.42);
    }

    .citadel::after {
      inset: 13px;
      border: 1px solid rgba(110,61,14,.68);
      box-shadow: inset 0 0 25px #000;
    }

    .form-shell {
      position: relative;
      z-index: 2;
      padding: 24px clamp(14px, 4vw, 34px) 28px;
      border: 1px solid #35240f;
      background:
        radial-gradient(circle at 18% 10%, rgba(111,58,16,.12), transparent 21rem),
        repeating-linear-gradient(117deg, transparent 0 33px, rgba(255,255,255,.012) 34px, transparent 35px 63px),
        rgba(9,9,8,.68);
      box-shadow: inset 0 0 50px rgba(0,0,0,.82);
    }

    .form-heading {
      position: relative;
      padding-bottom: 21px;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-heading::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6f390d 12%, #f1a640 50%, #6f390d 88%, transparent);
      box-shadow: 0 2px 10px rgba(233,86,18,.3);
    }

    .form-heading h1 {
      margin: 0;
      color: transparent;
      background: linear-gradient(180deg, #ffe3a3 3%, #d49b3e 48%, #7c330d 55%, #ef9b32 78%, #8e330f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      font: 800 clamp(1.68rem, 6vw, 2.75rem)/1.04 Cinzel, serif;
      letter-spacing: .055em;
      text-shadow: 0 3px 8px rgba(0,0,0,.6);
    }

    .form-heading p {
      margin: 9px 0 0;
      color: #c69855;
      font: 600 clamp(.65rem, 2.6vw, .82rem)/1.35 Cinzel, serif;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .form-grid { display: grid; gap: 18px; }

    .field {
      position: relative;
      padding: 15px 16px 17px;
      clip-path: polygon(0 10px, 10px 0, 100% 0, 100% 100%, 0 100%);
      border: 1px solid rgba(112,69,23,.35);
      background: linear-gradient(105deg, rgba(34,28,21,.46), rgba(4,4,4,.2));
    }

    .field.field-nama {
      clip-path: none;
      border-radius: 2px;
      z-index: 35;
    }

    .field.field-nip {
      z-index: 10;
    }

    .field.field-status {
      z-index: 5;
    }

    .field::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(transparent, #9e5719, transparent);
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
      color: #e7b75d;
      font: 700 .8rem/1.3 Cinzel, serif;
      letter-spacing: .105em;
      text-transform: uppercase;
    }

    .field-label-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .field-badge-info {
      font-family: Manrope, sans-serif;
      font-size: .67rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: none;
      color: #ffd67c;
      background: rgba(216, 156, 57, 0.14);
      border: 1px solid rgba(216, 156, 57, 0.35);
      border-radius: 12px;
      padding: 2px 9px;
    }

    .nip-auto-badge, .status-auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: Manrope, sans-serif;
      font-size: .67rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: none;
      color: #9dffba;
      background: rgba(24, 138, 64, 0.25);
      border: 1px solid rgba(52, 211, 110, 0.5);
      border-radius: 12px;
      padding: 2px 9px;
      animation: pulse-nip 2s infinite ease-in-out;
    }

    .status-auto-badge {
      color: #ffd67c;
      background: rgba(216, 156, 57, 0.2);
      border-color: rgba(216, 156, 57, 0.5);
    }

    @keyframes pulse-nip {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .85; transform: scale(1.03); }
    }

    .field-icon {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #ffca68;
      font: 800 .72rem/1 Cinzel, serif;
      border: 1px solid #8b501b;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #6c3b13, #130b05 70%);
      box-shadow: inset 0 0 5px #000, 0 0 8px rgba(198,68,10,.18);
    }

    .input-frame {
      position: relative;
      padding: 2px;
      clip-path: var(--cut);
      background: linear-gradient(115deg, #5a2a05, #e2a13e 16%, #4a2105 43%, #ffc85e 65%, #582603 88%);
      filter: drop-shadow(0 7px 9px rgba(0,0,0,.7));
    }

    .input-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      z-index: 1;
      clip-path: var(--cut);
      border: 1px solid rgba(99,39,8,.88);
      pointer-events: none;
    }

    .input-frame input,
    .input-frame select {
      position: relative;
      z-index: 0;
      width: 100%;
      min-height: 54px;
      margin: 0;
      padding: 14px 18px;
      color: #f3dfbd;
      background: linear-gradient(180deg, #050505, #11100e 55%, #080807);
      border: 0;
      border-radius: 0;
      clip-path: var(--cut);
      outline: none;
      font-size: .9rem;
      transition: color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .input-frame input::placeholder { color: #6f6a62; }

    .input-frame select {
      appearance: none;
      padding-right: 48px;
      color: #f0bd62;
      cursor: pointer;
      background-image:
        linear-gradient(45deg, transparent 50%, #e9a83f 50%),
        linear-gradient(135deg, #e9a83f 50%, transparent 50%),
        linear-gradient(180deg, #050505, #11100e 55%, #080807);
      background-position: calc(100% - 23px) 24px, calc(100% - 17px) 24px, 0 0;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      background-repeat: no-repeat;
    }

    .input-frame select option { background: #11100e; color: #f3dfbd; }

    .input-frame:focus-within {
      background: linear-gradient(115deg, #d94a12, #ffd46f 22%, #8c310b 45%, #ffd46f 72%, #d94a12);
      filter: drop-shadow(0 0 9px rgba(241,99,18,.5));
    }

    .input-frame:focus-within input,
    .input-frame:focus-within select {
      background-color: #150b07;
      box-shadow: inset 0 0 22px rgba(147,44,8,.25);
    }

    /* Autocomplete Search & Clear Button */
    .autocomplete-wrap {
      position: relative;
      width: 100%;
    }

    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(216, 156, 57, 0.45);
      background: rgba(26, 18, 14, 0.9);
      color: #ffb33f;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      transition: all .18s ease;
    }

    .clear-btn:hover {
      background: #8b1e0c;
      border-color: #f24916;
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    .input-frame.has-value .clear-btn {
      display: flex;
    }

    .input-frame.has-value input {
      padding-right: 48px;
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 120;
      background: linear-gradient(180deg, rgba(22, 19, 16, 0.98), rgba(12, 10, 9, 0.98));
      border: 1px solid #d89c39;
      border-radius: 4px;
      box-shadow: 0 18px 45px rgba(0,0,0,.96), 0 0 24px rgba(242,73,22,.28), inset 0 0 20px rgba(0,0,0,.8);
      max-height: 280px;
      overflow-y: auto;
      overscroll-behavior: contain;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: suggestDrop .18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes suggestDrop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .suggestions-box::-webkit-scrollbar { width: 6px; }
    .suggestions-box::-webkit-scrollbar-track { background: rgba(0,0,0,.4); }
    .suggestions-box::-webkit-scrollbar-thumb { background: #8b501b; border-radius: 3px; }
    .suggestions-box::-webkit-scrollbar-thumb:hover { background: #d89c39; }

    .suggestions-header {
      padding: 7px 14px 6px;
      font-size: .65rem;
      font-weight: 700;
      color: #9e8e79;
      letter-spacing: .12em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(216, 156, 57, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 8, 7, 0.92);
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .suggestion-item {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background .12s ease, padding-left .15s ease;
    }

    .suggestion-item:last-child { border-bottom: none; }

    .suggestion-item:hover,
    .suggestion-item.active {
      background: linear-gradient(90deg, rgba(216, 156, 57, 0.24), rgba(127, 22, 13, 0.4));
      padding-left: 18px;
    }

    .suggestion-item.active {
      border-left: 3px solid #f24916;
    }

    .suggestion-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      width: 100%;
    }

    .suggestion-name {
      color: #f5ead1;
      font-size: .84rem;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .suggestion-item:hover .suggestion-name,
    .suggestion-item.active .suggestion-name {
      color: #ffe0a1;
    }

    .suggestion-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .suggestion-nip-badge {
      font-family: monospace;
      font-size: .73rem;
      color: #ffd46f;
      background: rgba(0, 0, 0, 0.55);
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid rgba(216, 156, 57, 0.35);
      box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    .suggestion-status-tag {
      font-size: .64rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .suggestion-status-tag.op {
      color: #a3ffbd;
      background: rgba(24, 138, 64, 0.28);
      border: 1px solid rgba(52, 211, 110, 0.35);
    }

    .suggestion-status-tag.non-op {
      color: #ffd46f;
      background: rgba(216, 156, 57, 0.2);
      border: 1px solid rgba(216, 156, 57, 0.4);
    }

    .suggestion-hl {
      color: #ffe0a1;
      background: rgba(242, 73, 22, 0.42);
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(242, 73, 22, 0.85);
    }

    .suggestion-empty {
      padding: 16px 14px;
      text-align: center;
      color: #9e9588;
      font-size: .8rem;
      line-height: 1.4;
    }

    .nip-flash-anim {
      animation: nipFlash .75s ease-out;
    }

    @keyframes nipFlash {
      0% {
        box-shadow: inset 0 0 30px rgba(242, 73, 22, 0.85), 0 0 20px rgba(216, 156, 57, 0.85);
        color: #fff2d1;
      }
      100% {
        box-shadow: inset 0 0 22px rgba(147,44,8,.25);
      }
    }

    .upload-box {
      min-height: 74px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 11px;
      clip-path: var(--cut);
      background: linear-gradient(180deg, rgba(3,3,3,.96), rgba(17,15,13,.96));
      border: 1px solid #823511;
      box-shadow: inset 0 0 20px #000, 0 7px 14px rgba(0,0,0,.55);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .upload-box:focus-within {
      border-color: #f0a13b;
      box-shadow: inset 0 0 20px #000, 0 0 13px rgba(238,80,13,.32);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .browse {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 17px;
      color: #ffe3a7;
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
      border: 1px solid #e09b37;
      background: linear-gradient(180deg, #8d210c, #4c0d07 65%, #8d210c);
      box-shadow: inset 0 0 0 3px #2b0905, inset 0 0 0 4px rgba(255,180,62,.45), 0 5px 11px #000;
      font: 700 .72rem/1 Cinzel, serif;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .browse:hover { filter: brightness(1.25); transform: translateY(-1px); }
    .browse:active { transform: translateY(1px); }

    .folder {
      width: 15px;
      height: 11px;
      position: relative;
      display: inline-block;
      border-radius: 1px;
      background: #f1a916;
      box-shadow: inset 0 -2px 0 #a85508;
    }

    .folder::before {
      content: "";
      position: absolute;
      left: 1px;
      top: -4px;
      width: 7px;
      height: 5px;
      border-radius: 2px 2px 0 0;
      background: #ffc73e;
    }

    .file-meta { min-width: 0; }

    .file-name {
      display: block;
      overflow: hidden;
      color: #8f8980;
      font-size: .78rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-hint {
      display: block;
      margin-top: 3px;
      color: #5f5a53;
      font-size: .63rem;
      letter-spacing: .04em;
    }

    .upload-preview {
      width: 48px;
      height: 48px;
      display: none;
      object-fit: cover;
      border: 1px solid #c07625;
      background: #050505;
      box-shadow: 0 0 11px rgba(240,84,14,.22);
    }

    .upload-box.has-file .upload-preview { display: block; }
    .upload-box.has-file .file-name { color: #e9b75b; font-weight: 700; }

    .submit-wrap { padding: 8px 3px 1px; }

    .submit-btn {
      position: relative;
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
      color: #ffdda0;
      clip-path: var(--cut);
      border: 2px solid #c47b25;
      background: linear-gradient(180deg, #9d2810 0%, #5b0d08 53%, #8b1e0c 100%);
      box-shadow: inset 0 0 0 5px #270806, inset 0 0 0 6px rgba(255,198,90,.5), 0 13px 22px rgba(0,0,0,.65), 0 0 18px rgba(219,58,11,.25);
      font: 800 .84rem/1 Cinzel, serif;
      letter-spacing: .17em;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      inset: -60% -20%;
      background: linear-gradient(105deg, transparent 42%, rgba(255,231,172,.25) 49%, transparent 56%);
      transform: translateX(-55%);
      transition: transform .55s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
      box-shadow: inset 0 0 0 5px #270806, inset 0 0 0 6px rgba(255,198,90,.7), 0 17px 25px rgba(0,0,0,.7), 0 0 26px rgba(242,68,12,.38);
    }

    .submit-btn:hover::before { transform: translateX(55%); }
    .submit-btn:active { transform: translateY(1px) scale(.995); }
    .submit-btn:disabled { cursor: wait; filter: grayscale(.45); }

    .btn-rune { color: #ffb33f; font-size: 1.05rem; text-shadow: 0 0 8px #ff4b10; }

    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,225,163,.25);
      border-top-color: #ffd375;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: min(calc(100% - 28px), 520px);
      padding: 15px 18px;
      color: #f7e9cd;
      clip-path: var(--cut);
      border: 1px solid #d58e35;
      background: rgba(14,12,10,.96);
      box-shadow: 0 18px 42px #000, inset 0 0 20px rgba(180,66,12,.2);
      text-align: center;
      font-size: .83rem;
      transform: translate(-50%, 140%);
      opacity: 0;
      transition: transform .35s ease, opacity .35s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.success { border-color: #c99a42; }
    .toast.error { border-color: #d6381d; color: #ffd5c9; }

    footer {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px calc(4px + env(safe-area-inset-bottom));
      color: #6f675d;
      font: 600 .62rem/1.4 Cinzel, serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    footer .brand { color: #a77231; }

    @keyframes breathe {
      0%, 100% { opacity: .65; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes hover {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    @keyframes flame {
      from { transform: rotate(-3deg) scale(.92, 1); }
      to { transform: rotate(4deg) scale(1.05, .93); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .world { width: min(100%, 820px); }
      .guardian { width: 154px; height: 377px; opacity: .82; }
      .guardian.left { left: 0; transform: scaleX(-1); }
      .guardian.right { right: 0; }
    }

    @media (max-width: 680px) {
      .world { padding: 18px 9px 24px; }
      .world::before, .world::after { opacity: .4; }
      .decree { width: calc(100% - 28px); padding: 14px 29px 16px; margin-bottom: 3px; }
      .hero { min-height: 290px; margin-bottom: -12px; }
      .emblem-stage { width: 248px; height: 248px; }
      .emblem-core { width: 178px; height: 212px; }
      .emblem-ring { inset: 13px; }
      .sigil-caption { bottom: 6px; font-size: .52rem; }
      .guardian { top: 5px; width: 112px; height: 274px; opacity: .67; }
      .guardian.left { left: -23px; transform: scaleX(-1); }
      .guardian.right { right: -23px; }
      .citadel { width: 100%; padding: 10px; border-width: 2px; }
      .citadel::before { inset: 5px; }
      .citadel::after { inset: 8px; }
      .form-shell { padding: 22px 10px 20px; }
      .form-heading { padding-inline: 6px; }
      .field { padding: 13px 9px 14px; }
      .field-label { font-size: .7rem; letter-spacing: .08em; }
      .input-frame input, .input-frame select { min-height: 52px; padding-inline: 15px; font-size: 16px; }
      .upload-box { grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
      .upload-preview { grid-column: 1 / -1; width: 100%; height: 132px; }
      .browse { min-height: 44px; padding-inline: 13px; font-size: .67rem; }
      .file-hint { display: none; }
      .submit-btn { min-height: 58px; font-size: .74rem; letter-spacing: .13em; }

      /* Suggestion dropdown mobile fixes */
      .suggestions-box { max-height: 55vh; }
      .suggestions-header { font-size: .58rem; padding: 6px 10px 5px; letter-spacing: .08em; }
      .suggestion-item { padding: 9px 10px; gap: 5px; }
      .suggestion-item:hover, .suggestion-item.active { padding-left: 13px; }
      .suggestion-name { font-size: .8rem; }
      .suggestion-nip-badge { font-size: .66rem; padding: 2px 6px; }
      .suggestion-status-tag { font-size: .6rem; padding: 2px 5px; }
      .field-badge-info { font-size: .6rem; padding: 2px 7px; }
      .nip-auto-badge, .status-auto-badge { font-size: .6rem; }
    }

    @media (max-width: 380px) {
      .decree { padding-inline: 20px; }
      .decree-kicker { font-size: .64rem; letter-spacing: .18em; }
      .hero { min-height: 258px; }
      .emblem-stage { width: 218px; height: 218px; }
      .emblem-core { width: 158px; height: 188px; }
      .form-heading h1 { font-size: 1.42rem; }
      .form-heading p { font-size: .57rem; letter-spacing: .13em; }
      .browse .browse-text { display: none; }
      .browse { width: 45px; padding: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .emblem-core { transition: none; }
    }
  </style>
</head>
<body>
  <canvas class="embers" id="embers" aria-hidden="true"></canvas>
  <div class="gate-lines" aria-hidden="true"></div>

  <main class="world">
    <section class="decree" aria-labelledby="guidance-title">
      <div class="decree-kicker" id="guidance-title"><span class="ruby"></span> Petunjuk</div>
      <p id="guide-text" aria-live="polite">Isi data dengan lengkap, jangan disingkat.</p>
    </section>

    <section class="hero" aria-label="TVRI Stasiun Jambi">
      <div class="guardian left" aria-hidden="true">
        <img class="guardian-image" src="assets/dragon-statue.png" alt="">
      </div>
      <div class="emblem-stage" id="emblem-stage">
        <div class="emblem-ring"></div>
        <div class="emblem-core" id="emblem-core">
          <img src="assets/tvri-jambi-emblem.png" alt="Logo TVRI Stasiun Jambi" width="560" height="707">
        </div>
        <div class="sigil-caption">Lembaga Penyiaran Publik</div>
      </div>
      <div class="guardian right" aria-hidden="true">
        <img class="guardian-image" src="assets/dragon-statue.png" alt="">
      </div>
    </section>

    <section class="citadel" aria-labelledby="form-title">
      <div class="form-shell">
        <header class="form-heading">
          <h1 id="form-title">Formulir Absensi</h1>
          <p>Khusus Gangguan Massal SIMPEG</p>
        </header>

        <form id="cyber-form" class="form-grid" autocomplete="off">
          <div class="field field-nama">
            <label class="field-label" for="input-nama">
              <span class="field-label-left"><span class="field-icon">I</span> Nama Lengkap</span>
              <span class="field-badge-info" id="badge-total-pegawai">Memuat data pegawai…</span>
            </label>
            <div class="autocomplete-wrap">
              <div class="input-frame" id="frame-nama">
                <input type="text" name="Nama_Lengkap" id="input-nama" placeholder="Ketik nama atau pilih pegawai…" autocomplete="off" required data-guide="Ketik nama Anda untuk memilih dari data pegawai TVRI Jambi.">
                <button type="button" class="clear-btn" id="btn-clear-nama" title="Hapus pilihan nama" aria-label="Hapus input nama">✕</button>
              </div>
              <div class="suggestions-box" id="suggestions-box" role="listbox" aria-label="Daftar Pegawai" style="display: none;"></div>
            </div>
          </div>

          <div class="field field-nip">
            <label class="field-label" for="input-nip">
              <span class="field-label-left"><span class="field-icon">II</span> NIP</span>
              <span class="nip-auto-badge" id="badge-nip-status" style="display: none;">✓ NIP Terisi</span>
            </label>
            <div class="input-frame" id="frame-nip">
              <input type="text" name="NIP" id="input-nip" placeholder="NIP akan otomatis terisi…" autocomplete="off" inputmode="numeric" required data-guide="NIP otomatis masuk saat nama pegawai dipilih.">
              <button type="button" class="clear-btn" id="btn-clear-nip" title="Hapus NIP" aria-label="Hapus input NIP">✕</button>
            </div>
          </div>

          <div class="field field-status">
            <label class="field-label" for="input-status">
              <span class="field-label-left"><span class="field-icon">III</span> Status Operasional</span>
              <span class="status-auto-badge" id="badge-status-auto" style="display: none;">✓ Otomatis</span>
            </label>
            <div class="input-frame" id="frame-status">
              <select name="Status_Operasional" id="input-status" required data-guide="Pilih kondisi operasional Anda saat ini. Otomatis terisi saat nama dipilih.">
                <option value="Operasional">Operasional</option>
                <option value="Non Operasional">Non Operasional</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="input-file-datang"><span class="field-label-left"><span class="field-icon">◆</span> Upload Foto Geotag Datang</span></label>
            <div class="upload-box" id="upload-datang">
              <input class="file-input" type="file" id="input-file-datang" accept="image/*" required data-guide="Unggah foto geotag kedatangan, maksimal 10 MB.">
              <label class="browse" for="input-file-datang"><span class="folder"></span><span class="browse-text">Pilih Foto</span></label>
              <span class="file-meta"><span class="file-name" id="file-name-datang">Belum ada file dipilih…</span><span class="file-hint">Gambar JPG/PNG • Maksimal 10 MB</span></span>
              <img class="upload-preview" id="preview-datang" alt="Pratinjau foto geotag datang">
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="input-file-pulang"><span class="field-label-left"><span class="field-icon">◆</span> Upload Foto Geotag Pulang</span></label>
            <div class="upload-box" id="upload-pulang">
              <input class="file-input" type="file" id="input-file-pulang" accept="image/*" required data-guide="Unggah foto geotag kepulangan, maksimal 10 MB.">
              <label class="browse" for="input-file-pulang"><span class="folder"></span><span class="browse-text">Pilih Foto</span></label>
              <span class="file-meta"><span class="file-name" id="file-name-pulang">Belum ada file dipilih…</span><span class="file-hint">Gambar JPG/PNG • Maksimal 10 MB</span></span>
              <img class="upload-preview" id="preview-pulang" alt="Pratinjau foto geotag pulang">
            </div>
          </div>

          <div class="submit-wrap">
            <button class="submit-btn" type="submit" id="btn-submit">
              <span class="btn-rune">✦</span><span>Kirim Data Absensi</span><span class="btn-rune">✦</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <footer><span>Satria © 2026</span><span class="ruby"></span><span class="brand">TVRI Stasiun Jambi</span></footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOuZByZn-UCECxh5k73L2g7pxDfyubmLC9L4zzS6Lqld2zyW0y2qb0H3lb8laK4JN-/exec';

    // --- Klien API Pencarian Pegawai (data lengkap tidak pernah dikirim ke browser) ---
    const badgeTotal = document.getElementById('badge-total-pegawai');
    let totalPegawai = null;

    const searchCache = new Map();
    const SEARCH_CACHE_TTL = 60000;

    function cacheGet(key) {
      const hit = searchCache.get(key);
      if (hit && Date.now() - hit.t < SEARCH_CACHE_TTL) return hit.data;
      if (hit) searchCache.delete(key);
      return null;
    }

    function cacheSet(key, data) {
      if (searchCache.size > 60) searchCache.clear();
      searchCache.set(key, { t: Date.now(), data: data });
    }

    function debounce(fn, ms) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), ms);
      };
    }

    async function fetchPegawai(query, signal) {
      const key = query.trim().toLowerCase();
      const cached = cacheGet(key);
      if (cached) return cached;
      const url = GOOGLE_SCRIPT_URL + '?action=cari&q=' + encodeURIComponent(key);
      const resp = await fetch(url, { signal: signal });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      if (!data || data.status !== 'success') throw new Error((data && data.message) || 'Respons tidak valid');
      cacheSet(key, data);
      return data;
    }

    function updateTotalPegawai(data) {
      if (data && typeof data.total === 'number' && data.total !== totalPegawai) {
        totalPegawai = data.total;
        if (badgeTotal) badgeTotal.textContent = totalPegawai + ' Pegawai Terdaftar';
      }
    }

    const guideText = document.getElementById('guide-text');
    const defaultGuide = 'Isi data dengan lengkap, jangan disingkat.';
    document.querySelectorAll('[data-guide]').forEach((control) => {
      control.addEventListener('focus', () => { guideText.textContent = control.dataset.guide; });
      control.addEventListener('blur', () => { guideText.textContent = defaultGuide; });
    });

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message, type = 'success') {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4500);
    }

    // --- Autocomplete & Otomatisasi NIP / Status Operasional ---
    const inputNama = document.getElementById('input-nama');
    const inputNip = document.getElementById('input-nip');
    const inputStatus = document.getElementById('input-status');
    const frameNama = document.getElementById('frame-nama');
    const frameNip = document.getElementById('frame-nip');
    const frameStatus = document.getElementById('frame-status');
    const btnClearNama = document.getElementById('btn-clear-nama');
    const btnClearNip = document.getElementById('btn-clear-nip');
    const suggestionsBox = document.getElementById('suggestions-box');
    const badgeNipStatus = document.getElementById('badge-nip-status');
    const badgeStatusAuto = document.getElementById('badge-status-auto');

    let currentMatches = [];
    let activeSuggestionIndex = -1;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[tag] || tag));
    }

    function highlightMatch(text, query) {
      if (!query) return escapeHtml(text);
      const terms = query.trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return escapeHtml(text);
      
      const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      const regex = new RegExp('(' + pattern + ')', 'gi');
      return escapeHtml(text).replace(regex, '<span class="suggestion-hl">$1</span>');
    }

    let searchAbort = null;

    async function renderSuggestions(query = '') {
      const q = query.trim();
      activeSuggestionIndex = -1;
      suggestionsBox.innerHTML = '<div class="suggestion-empty">Mencari…</div>';
      suggestionsBox.style.display = 'block';

      let data;
      try {
        if (searchAbort) searchAbort.abort();
        searchAbort = new AbortController();
        data = await fetchPegawai(q, searchAbort.signal);
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        currentMatches = [];
        suggestionsBox.innerHTML =
          '<div class="suggestion-empty">' +
            '<div>Gagal memuat data pegawai.</div>' +
            '<div style="color: #7d7568; font-size: .72rem; margin-top: 4px;">Periksa koneksi internet lalu coba lagi.</div>' +
          '</div>';
        suggestionsBox.style.display = 'block';
        return;
      }

      updateTotalPegawai(data);
      currentMatches = data.results || [];
      activeSuggestionIndex = -1;

      if (currentMatches.length === 0) {
        suggestionsBox.innerHTML = 
          '<div class="suggestion-empty">' +
            '<div>Tidak ditemukan pegawai dengan kata kunci "<strong>' + escapeHtml(q) + '</strong>"</div>' +
            '<div style="color: #7d7568; font-size: .72rem; margin-top: 4px;">Anda tetap dapat mengetik nama, NIP, dan memilih status secara manual</div>' +
          '</div>';
        suggestionsBox.style.display = 'block';
        return;
      }

      const totalCount = (typeof data.matches === 'number') ? data.matches : currentMatches.length;

      let html = 
        '<div class="suggestions-header">' +
          '<span>' + (q ? 'Hasil Pencarian' : 'Daftar Pegawai TVRI Jambi') + '</span>' +
          '<span>' + totalCount + ' Pegawai' + (totalCount > currentMatches.length ? ' (Tampil ' + currentMatches.length + ')' : '') + '</span>' +
        '</div>';

      html += currentMatches.map((p, idx) => {
        const isOp = p.status === 'Operasional';
        const tagClass = isOp ? 'op' : 'non-op';
        return '<div class="suggestion-item" data-index="' + idx + '" role="option" id="opt-' + idx + '">' +
          '<div class="suggestion-info">' +
            '<div class="suggestion-name">' + highlightMatch(p.nama, q) + '</div>' +
          '</div>' +
          '<div class="suggestion-badges">' +
            '<span class="suggestion-status-tag ' + tagClass + '">' + escapeHtml(p.status || 'Operasional') + '</span>' +
            '<span class="suggestion-nip-badge">' + highlightMatch(p.nip, q) + '</span>' +
          '</div>' +
        '</div>';
      }).join('');

      suggestionsBox.innerHTML = html;
      suggestionsBox.style.display = 'block';

      // Event listeners for suggestion items
      suggestionsBox.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const idx = parseInt(item.getAttribute('data-index'), 10);
          if (currentMatches[idx]) {
            pilihPegawai(currentMatches[idx]);
          }
        });
      });

      // Jika nama yang diketik sudah persis cocok, isi NIP & status otomatis
      if (document.activeElement === inputNama) {
        syncFromName(inputNama.value);
      }
    }

    const renderSuggestionsDebounced = debounce(renderSuggestions, 150);

    function pilihPegawai(pegawai) {
      inputNama.value = pegawai.nama;
      inputNip.value = pegawai.nip;
      
      // Auto-set Status Operasional
      if (pegawai.status) {
        inputStatus.value = pegawai.status;
        badgeStatusAuto.textContent = '✓ ' + pegawai.status;
        badgeStatusAuto.style.display = 'inline-flex';
        
        // Status flash animation
        frameStatus.classList.remove('nip-flash-anim');
        void frameStatus.offsetWidth;
        frameStatus.classList.add('nip-flash-anim');
      }
      
      frameNama.classList.add('has-value');
      frameNip.classList.add('has-value');
      badgeNipStatus.style.display = 'inline-flex';
      
      // NIP flash animation
      frameNip.classList.remove('nip-flash-anim');
      void frameNip.offsetWidth;
      frameNip.classList.add('nip-flash-anim');

      guideText.textContent = 'Pegawai terpilih: ' + pegawai.nama + ' (NIP: ' + pegawai.nip + ', Status: ' + (pegawai.status || 'Operasional') + ')';
      showToast('Pegawai: ' + pegawai.nama + ' — NIP & Status otomatis terisi', 'success');
      
      closeSuggestions();
    }

    function closeSuggestions() {
      suggestionsBox.style.display = 'none';
      activeSuggestionIndex = -1;
    }

    function updateActiveSuggestion() {
      const items = suggestionsBox.querySelectorAll('.suggestion-item');
      items.forEach((item, idx) => {
        if (idx === activeSuggestionIndex) {
          item.classList.add('active');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });
    }

    function syncFromName(nameValue) {
      const clean = nameValue.trim().toLowerCase();
      if (!clean) {
        frameNama.classList.remove('has-value');
        return;
      }
      frameNama.classList.add('has-value');

      const found = currentMatches.find(p => p.nama.toLowerCase() === clean);
      if (found) {
        inputNip.value = found.nip;
        frameNip.classList.add('has-value');
        badgeNipStatus.style.display = 'inline-flex';
        if (found.status) {
          inputStatus.value = found.status;
          badgeStatusAuto.textContent = '✓ ' + found.status;
          badgeStatusAuto.style.display = 'inline-flex';
        }
      }
    }

    async function syncFromNip(nipValue) {
      const clean = nipValue.trim();
      if (!clean) {
        frameNip.classList.remove('has-value');
        badgeNipStatus.style.display = 'none';
        return;
      }
      frameNip.classList.add('has-value');

      let data;
      try {
        data = await fetchPegawai(clean, undefined);
      } catch (err) {
        return;
      }
      updateTotalPegawai(data);

      const found = (data.results || []).find(p => p.nip === clean);
      if (found) {
        inputNama.value = found.nama;
        frameNama.classList.add('has-value');
        badgeNipStatus.style.display = 'inline-flex';
        if (found.status) {
          inputStatus.value = found.status;
          badgeStatusAuto.textContent = '✓ ' + found.status;
          badgeStatusAuto.style.display = 'inline-flex';
        }
      }
    }

    const syncFromNipDebounced = debounce(syncFromNip, 150);

    inputNama.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val) {
        frameNama.classList.add('has-value');
      } else {
        frameNama.classList.remove('has-value');
        inputNip.value = '';
        frameNip.classList.remove('has-value');
        badgeNipStatus.style.display = 'none';
        badgeStatusAuto.style.display = 'none';
      }
      renderSuggestionsDebounced(val);
      syncFromName(val);
    });

    inputNama.addEventListener('focus', () => {
      renderSuggestions(inputNama.value);
    });

    inputNama.addEventListener('keydown', (e) => {
      const items = suggestionsBox.querySelectorAll('.suggestion-item');
      if (!items.length || suggestionsBox.style.display === 'none') {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          renderSuggestions(inputNama.value);
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
        updateActiveSuggestion();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
        updateActiveSuggestion();
      } else if (e.key === 'Enter') {
        if (activeSuggestionIndex >= 0 && currentMatches[activeSuggestionIndex]) {
          e.preventDefault();
          pilihPegawai(currentMatches[activeSuggestionIndex]);
        }
      } else if (e.key === 'Escape') {
        closeSuggestions();
      } else if (e.key === 'Tab') {
        if (activeSuggestionIndex >= 0 && currentMatches[activeSuggestionIndex]) {
          pilihPegawai(currentMatches[activeSuggestionIndex]);
        }
        closeSuggestions();
      }
    });

    inputNip.addEventListener('input', (e) => {
      syncFromNipDebounced(e.target.value);
    });

    inputStatus.addEventListener('change', () => {
      badgeStatusAuto.textContent = '✓ Manual';
      badgeStatusAuto.style.display = 'inline-flex';
    });

    btnClearNama.addEventListener('click', (e) => {
      e.preventDefault();
      inputNama.value = '';
      inputNip.value = '';
      inputStatus.value = 'Operasional';
      frameNama.classList.remove('has-value');
      frameNip.classList.remove('has-value');
      badgeNipStatus.style.display = 'none';
      badgeStatusAuto.style.display = 'none';
      inputNama.focus();
      renderSuggestions('');
    });

    btnClearNip.addEventListener('click', (e) => {
      e.preventDefault();
      inputNip.value = '';
      frameNip.classList.remove('has-value');
      badgeNipStatus.style.display = 'none';
      inputNip.focus();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.field-nama')) {
        closeSuggestions();
      }
    });

    // Ambil total pegawai saat halaman dibuka (tanpa menampilkan daftar)
    if (badgeTotal) badgeTotal.textContent = 'Memuat data pegawai…';
    fetchPegawai('', undefined)
      .then(updateTotalPegawai)
      .catch(() => { if (badgeTotal) badgeTotal.textContent = 'Data pegawai gagal dimuat'; });

    // --- File Upload & Compression ---
    let fileDataDatang = { base64: '', name: '', type: '' };
    let fileDataPulang = { base64: '', name: '', type: '' };

    function clearFile(type) {
      const input = document.getElementById('input-file-' + type);
      const box = document.getElementById('upload-' + type);
      const preview = document.getElementById('preview-' + type);
      const name = document.getElementById('file-name-' + type);
      input.value = '';
      name.textContent = 'Belum ada file dipilih…';
      box.classList.remove('has-file');
      preview.removeAttribute('src');
      if (type === 'datang') fileDataDatang = { base64: '', name: '', type: '' };
      else fileDataPulang = { base64: '', name: '', type: '' };
    }

    function compressImage(file, type) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (event) => {
          const image = new Image();
          image.onerror = reject;
          image.onload = () => {
            const limit = 1200;
            const ratio = Math.min(1, limit / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * ratio));
            canvas.height = Math.max(1, Math.round(image.height * ratio));
            const context = canvas.getContext('2d');
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', .72);
            resolve({ base64: dataUrl.split(',')[1], name: file.name, type: 'image/jpeg' });
          };
          image.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFileChange(type) {
      const input = document.getElementById('input-file-' + type);
      const box = document.getElementById('upload-' + type);
      const preview = document.getElementById('preview-' + type);
      const name = document.getElementById('file-name-' + type);
      const file = input.files[0];
      if (!file) return clearFile(type);
      if (!file.type.startsWith('image/')) {
        clearFile(type);
        showToast('File harus berupa gambar JPG atau PNG.', 'error');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        clearFile(type);
        showToast('Ukuran foto terlalu besar. Batas maksimal 10 MB.', 'error');
        return;
      }

      name.textContent = 'Menyiapkan foto…';
      try {
        const compressed = await compressImage(file, type);
        if (type === 'datang') fileDataDatang = compressed;
        else fileDataPulang = compressed;
        name.textContent = file.name;
        preview.src = URL.createObjectURL(file);
        box.classList.add('has-file');
        guideText.textContent = 'Foto geotag ' + type + ' siap dikirim.';
      } catch (error) {
        console.error(error);
        clearFile(type);
        showToast('Foto tidak dapat diproses. Silakan pilih foto lain.', 'error');
      }
    }

    document.getElementById('input-file-datang').addEventListener('change', () => handleFileChange('datang'));
    document.getElementById('input-file-pulang').addEventListener('change', () => handleFileChange('pulang'));

    // --- Form Submit Handling ---
    const form = document.getElementById('cyber-form');
    const btnSubmit = document.getElementById('btn-submit');
    const defaultButton = '<span class="btn-rune">✦</span><span>Kirim Data Absensi</span><span class="btn-rune">✦</span>';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!fileDataDatang.base64) {
        showToast('Tunggu hingga foto geotag datang selesai disiapkan.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner"></span><span>Mengirim Data…</span>';
      guideText.textContent = 'Data sedang dikirim ke server SDM. Mohon tunggu.';

      const payload = {
        Nama_Lengkap: inputNama.value.trim(),
        NIP: inputNip.value.trim(),
        Status_Operasional: inputStatus.value,
        File_Datang_Base64: fileDataDatang.base64,
        File_Datang_Name: fileDataDatang.name,
        File_Datang_Type: fileDataDatang.type,
        File_Pulang_Base64: fileDataPulang.base64,
        File_Pulang_Name: fileDataPulang.name,
        File_Pulang_Type: fileDataPulang.type
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        form.reset();
        frameNama.classList.remove('has-value');
        frameNip.classList.remove('has-value');
        badgeNipStatus.style.display = 'none';
        badgeStatusAuto.style.display = 'none';
        clearFile('datang');
        clearFile('pulang');
        guideText.textContent = 'Data telah diterima oleh SDM. Terima kasih.';
        showToast('Data dan foto berhasil dikirim ke server SDM.', 'success');
      } catch (error) {
        console.error(error);
        guideText.textContent = 'Pengiriman gagal. Periksa koneksi lalu coba kembali.';
        showToast('Data gagal dikirim. Silakan coba kembali.', 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = defaultButton;
      }
    });

    // --- 3D Hover & Particles ---
    const emblemStage = document.getElementById('emblem-stage');
    const emblemCore = document.getElementById('emblem-core');
    if (matchMedia('(pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      emblemStage.addEventListener('pointermove', (event) => {
        const rect = emblemStage.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - .5;
        const y = (event.clientY - rect.top) / rect.height - .5;
        emblemCore.style.transform = 'rotateY(' + (x * 14) + 'deg) rotateX(' + (-y * 11) + 'deg) translateZ(12px)';
      });
      emblemStage.addEventListener('pointerleave', () => { emblemCore.style.transform = ''; });
    }

    const emberCanvas = document.getElementById('embers');
    const emberContext = emberCanvas.getContext('2d');
    let particles = [];
    let animationFrame;

    function sizeEmbers() {
      const scale = Math.min(devicePixelRatio || 1, 2);
      emberCanvas.width = innerWidth * scale;
      emberCanvas.height = innerHeight * scale;
      emberCanvas.style.width = innerWidth + 'px';
      emberCanvas.style.height = innerHeight + 'px';
      emberContext.setTransform(scale, 0, 0, scale, 0, 0);
      const count = Math.min(75, Math.max(28, Math.round(innerWidth / 16)));
      particles = Array.from({ length: count }, () => makeEmber(true));
    }

    function makeEmber(randomY = false) {
      return {
        x: Math.random() * innerWidth,
        y: randomY ? Math.random() * innerHeight : innerHeight + 8,
        r: Math.random() * 1.7 + .35,
        vx: (Math.random() - .5) * .45,
        vy: -(Math.random() * .7 + .35),
        life: Math.random() * .65 + .25
      };
    }

    function drawEmbers() {
      emberContext.clearRect(0, 0, innerWidth, innerHeight);
      particles.forEach((particle, index) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life -= .0015;
        if (particle.y < -10 || particle.life <= 0) particles[index] = makeEmber();
        const glow = emberContext.createRadialGradient(particle.x, particle.y, 0, particle.x, particle.y, particle.r * 4);
        glow.addColorStop(0, 'rgba(255,220,115,' + particle.life + ')');
        glow.addColorStop(.25, 'rgba(255,88,20,' + (particle.life * .8) + ')');
        glow.addColorStop(1, 'rgba(190,35,6,0)');
        emberContext.fillStyle = glow;
        emberContext.beginPath();
        emberContext.arc(particle.x, particle.y, particle.r * 4, 0, Math.PI * 2);
        emberContext.fill();
      });
      animationFrame = requestAnimationFrame(drawEmbers);
    }

    sizeEmbers();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) drawEmbers();
    addEventListener('resize', sizeEmbers, { passive: true });
    addEventListener('pagehide', () => cancelAnimationFrame(animationFrame), { once: true });
  </script>
</body>
</html>
