<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM Cyber Portal - Form Interaktif</title>
    <!-- Tailwind CSS untuk tata letak -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Animasi Melayang untuk Robot */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        /* Animasi Kedipan Mata Robot */
        @keyframes blink {
            0%, 90%, 100% { height: 12px; }
            95% { height: 2px; }
        }
        .robot-float { animation: float 4s ease-in-out infinite; }
        .robot-eye { animation: blink 4s infinite; }
        
        /* Efek Glow Neon & Glassmorphism */
        .cyber-panel {
            background: rgba(10, 20, 40, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        .neon-input:focus {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            border-color: rgba(0, 243, 255, 0.8);
        }
        
        /* Mengunci Canvas di Background */
        #flow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #030712;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <!-- CANVAS UNTUK EFEK ALIRAN ASAP & AIR -->
    <canvas id="flow-bg"></canvas>

    <!-- CONTAINER UTAMA -->
    <div class="max-w-2xl mx-auto w-full my-6 p-4 flex-grow flex flex-col justify-center relative z-10">
        
        <!-- BAGIAN ROBOT INTERAKTIF (GUIDE) -->
        <div class="flex flex-col items-center mb-6">
            <!-- Balon Teks Robot -->
            <div class="bg-cyan-900/90 border border-cyan-400 text-cyan-200 px-4 py-2 rounded-xl text-sm font-mono mb-4 shadow-md max-w-xs text-center relative">
                <p id="robot-bubble">Sistem Siap. Silakan isi identitas Anda, Agen SDM!</p>
                <!-- Segitiga Balon Teks -->
                <div class="absolute bottom-[-6px] left-1/2 transform -translate-x-1/2 w-3 h-3 bg-cyan-900 border-r border-b border-cyan-400 rotate-45"></div>
            </div>

            <!-- Visual Robot Kustom (Pure CSS & SVG) -->
            <div class="robot-float w-24 h-24 bg-gradient-to-b from-slate-700 to-slate-900 border-2 border-cyan-400 rounded-2xl flex flex-col items-center justify-center p-2 shadow-[0_0_20px_rgba(0,243,255,0.4)] relative">
                <!-- Antena -->
                <div class="w-1 h-4 bg-cyan-400 absolute top-[-16px] rounded-full"></div>
                <div class="w-3 h-3 bg-cyan-400 rounded-full absolute top-[-24px] animate-ping"></div>
                <div class="w-3 h-3 bg-cyan-300 rounded-full absolute top-[-24px]"></div>
                
                <!-- Telinga Baut -->
                <div class="w-2 h-4 bg-slate-600 border border-cyan-400 absolute left-[-8px] rounded"></div>
                <div class="w-2 h-4 bg-slate-600 border border-cyan-400 absolute right-[-8px] rounded"></div>

                <!-- Layar Wajah -->
                <div class="w-full h-12 bg-gray-950 border border-cyan-500/50 rounded-lg flex items-center justify-center space-x-3 p-1">
                    <!-- Mata Kiri -->
                    <div id="eye-l" class="robot-eye w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(0,243,255,0.8)]"></div>
                    <!-- Mata Kanan -->
                    <div id="eye-r" class="robot-eye w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(0,243,255,0.8)]"></div>
                </div>
                <!-- Garis Mulut Digital -->
                <div id="robot-mouth" class="w-10 h-1 bg-cyan-400 rounded-full mt-2 transition-all duration-300 shadow-[0_0_5px_rgba(0,243,255,0.8)]"></div>
            </div>
        </div>

        <!-- PANEL FORM CYBERPUNK -->
        <div class="cyber-panel p-6 rounded-2xl relative overflow-hidden">
            <!-- Garis Dekorasi Cyber -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent"></div>
            
            <form id="cyber-form" class="space-y-5">
                <div class="text-center border-b border-cyan-500/20 pb-3">
                    <h2 class="text-xl font-mono font-bold text-cyan-400 tracking-wider neon-text-cyan">FORMULIR DATA INPUT SDM</h2>
                    <p class="text-xs text-slate-400 font-mono mt-1">SECURE TRANSMISSION PROTOCOL TO SHEETS</p>
                </div>

                <!-- Input Nama -->
                <div>
                    <label class="block text-xs font-mono tracking-widest text-cyan-400 mb-1">NAMA LENGKAP</label>
                    <input type="text" name="Nama" id="input-nama" required 
                           onfocus="updateRobot('nama')" 
                           class="neon-input w-full bg-slate-950/80 border border-slate-700 rounded-lg p-3 text-sm text-cyan-200 font-mono focus:outline-none transition-all">
                </div>

                <!-- Input NIP -->
                <div>
                    <label class="block text-xs font-mono tracking-widest text-cyan-400 mb-1">NIP / NOMOR PEGAWAI</label>
                    <input type="text" name="NIP" id="input-nip" required 
                           onfocus="updateRobot('nip')" 
                           class="neon-input w-full bg-slate-950/80 border border-slate-700 rounded-lg p-3 text-sm text-cyan-200 font-mono focus:outline-none transition-all">
                </div>

                <!-- Input Jabatan -->
                <div>
                    <label class="block text-xs font-mono tracking-widest text-cyan-400 mb-1">JABATAN / DIVISI</label>
                    <input type="text" name="Jabatan" id="input-jabatan" required 
                           onfocus="updateRobot('jabatan')" 
                           class="neon-input w-full bg-slate-950/80 border border-slate-700 rounded-lg p-3 text-sm text-cyan-200 font-mono focus:outline-none transition-all">
                </div>

                <!-- Input Keperluan -->
                <div>
                    <label class="block text-xs font-mono tracking-widest text-cyan-400 mb-1">DESKRIPSI KEPERLUAN / ALASAN</label>
                    <textarea name="Keperluan" id="input-keperluan" rows="3" required 
                              onfocus="updateRobot('keperluan')" 
                              class="neon-input w-full bg-slate-950/80 border border-slate-700 rounded-lg p-3 text-sm text-cyan-200 font-mono focus:outline-none transition-all"></textarea>
                </div>

                <!-- Tombol Kirim -->
                <div class="pt-2">
                    <button type="submit" id="btn-submit" 
                            class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-mono font-bold tracking-widest py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all duration-300 transform active:scale-[0.99]">
                        EXECUTE SUBMIT SYSTEM
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-[10px] font-mono tracking-widest text-slate-500 relative z-10">
        SDM JAMBI MATRIX SYSTEM &copy; 2026 // ALL RIGHTS RESERVED
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const GOOGLE_SCRIPT_URL = 'URL_WEB_APP_ANDA_DI_SINI';

        // 1. KONTROL INTERAKSI ROBOT
        const robotBubble = document.getElementById('robot-bubble');
        const eyeL = document.getElementById('eye-l');
        const eyer = document.getElementById('eye-r');
        const mouth = document.getElementById('robot-mouth');

        function updateRobot(field) {
            // Reset Warna Mata & Mulut standar (Cyan)
            eyeL.className = eyer.className = "robot-eye w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(0,243,255,0.8)]";
            mouth.className = "w-10 h-1 bg-cyan-400 rounded-full mt-2 transition-all duration-300";

            if (field === 'nama') {
                robotBubble.innerText = "Ketik nama lengkap Anda dengan benar ya.";
            } else if (field === 'nip') {
                robotBubble.innerText = "NIP digunakan untuk validasi database pusat.";
            } else if (field === 'jabatan') {
                robotBubble.innerText = "Di divisi mana Anda bertugas saat ini?";
                // Ubah mulut jadi senyum tipis
                mouth.className = "w-10 h-2 bg-cyan-400 rounded-b-full mt-2 transition-all duration-300";
            } else if (field === 'keperluan') {
                robotBubble.innerText = "Jelaskan alasan pengajuan Anda secara ringkas.";
            }
        }

        // 2. KANVAS ALIRAN AIR & ASAP (FLUID STREAM SIMULATION)
        const canvas = document.getElementById('flow-bg');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FlowParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.speedY = -(Math.random() * 1.5 + 0.5);
                this.speedX = Math.sin(Math.random() * 5);
                this.size = Math.random() * 80 + 40;
                // Warna gradasi air/asap (Cyan, Biru, Ungu)
                const colors = ['rgba(6, 182, 212, ', 'rgba(29, 78, 216, ', 'rgba(109, 40, 217, '];
                this.baseColor = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.15 + 0.05;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.2 - 0.1;
            }
            update() {
                this.y += this.speedY;
                this.angle += this.spin;
                // Gerakan mengalir zig-zag seperti air/asap lembut
                this.x += Math.sin(this.y / 50) * 0.6 + this.speedX * 0.2;
                
                // Jika partikel melayang keluar layar atas, reset ke bawah
                if (this.y < -this.size) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                // Membuat lingkaran kabur menyerupai asap cair
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, this.baseColor + '1)');
                gradient.addColorStop(0.5, this.baseColor + '0.3)');
                gradient.addColorStop(1, this.baseColor + '0)');
                
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Inisialisasi Kumpulan Partikel
        for (let i = 0; i < particleCount; i++) {
            particles.push(new FlowParticle());
        }

        // Loop Animasi Efek Aliran
        function animateFlow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Latar belakang ruang angkasa gelap gulita
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateFlow);
        }
        animateFlow();

        // 3. SUBMIT DATA KE GOOGLE SHEETS
        const form = document.getElementById('cyber-form');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reaksi Robot Saat Mengirim Data (Mata Hijau & Mulut Senang)
            robotBubble.innerText = "Memulai transmisi data enkripsi ke Google Sheets...";
            eyeL.className = eyer.className = "w-3 h-3 bg-emerald-400 rounded-full shadow-[0_0_8px_rgba(52,211,153,0.8)]";
            mouth.className = "w-10 h-3 bg-emerald-400 rounded-b-full mt-2 transition-all duration-300";

            btnSubmit.innerText = "TRANSMITTING DATA...";
            btnSubmit.disabled = true;

            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => { dataObj[key] = value; });

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataObj)
                });

                robotBubble.innerText = "Transmisi Selesai! Data aman tersimpan di database.";
                alert("Data Berhasil Terkirim!");
                form.reset();
            } catch (error) {
                console.error(error);
                // Reaksi Robot Jika Gagal (Mata Merah)
                eyeL.className = eyer.className = "w-3 h-3 bg-rose-500 rounded-full shadow-[0_0_8px_rgba(244,63,94,0.8)]";
                robotBubble.innerText = "Upps! Terjadi gangguan sinyal/koneksi.";
                alert("Gagal Mengirim Data.");
            } finally {
                btnSubmit.innerText = "EXECUTE SUBMIT SYSTEM";
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
